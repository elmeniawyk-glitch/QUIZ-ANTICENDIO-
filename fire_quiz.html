<head>

<title>Quiz Antincendio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#2d3748;min-height:100vh}
#app{max-width:860px;margin:0 auto;padding:20px}
#home{text-align:center;padding:30px 20px}
.logo{font-size:56px;margin-bottom:10px}
h1{font-size:28px;font-weight:700;color:#1a365d;margin-bottom:6px}
.subtitle{color:#4a5568;font-size:15px;margin-bottom:30px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px;margin:0 auto 24px}
.mode-card{background:#fff;border-radius:14px;padding:24px 18px;cursor:pointer;border:2.5px solid transparent;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mode-card:hover{border-color:#3182ce;transform:translateY(-2px)}
.mode-card .icon{font-size:36px;margin-bottom:10px}
.mode-card h3{font-size:16px;font-weight:600;margin-bottom:5px}
.mode-card p{font-size:12px;color:#718096}
.topics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;max-width:700px;margin:0 auto}
.topic-btn{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px 10px;cursor:pointer;font-size:13px;font-weight:500;color:#2d3748;transition:all .2s;text-align:center}
.topic-btn:hover{background:#ebf8ff;border-color:#3182ce;color:#2b6cb0}
.topic-btn .t-icon{font-size:22px;display:block;margin-bottom:6px}
.topic-btn .t-count{font-size:11px;color:#a0aec0;display:block;margin-top:4px}
.section-title{font-size:14px;font-weight:600;color:#4a5568;text-transform:uppercase;letter-spacing:.8px;margin:24px 0 12px}
#quiz{display:none}
.quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{background:#fff;border:1.5px solid #e2e8f0;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:#4a5568}
.back-btn:hover{background:#f7fafc}
.quiz-title{font-size:16px;font-weight:600;color:#2d3748;flex:1}
.progress-wrap{margin-bottom:16px}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:#718096;margin-bottom:6px}
.progress-bar{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#3182ce,#2b6cb0);border-radius:99px;transition:width .4s}
.score-badges{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-correct{background:#c6f6d5;color:#22543d}
.badge-wrong{background:#fed7d7;color:#742a2a}
.badge-remain{background:#bee3f8;color:#2a4365}
.q-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:16px}
.q-num{font-size:11px;font-weight:600;color:#a0aec0;text-transform:uppercase;margin-bottom:8px}
.q-text{font-size:15px;font-weight:500;line-height:1.55;color:#1a365d;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{background:#f7fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:13px 16px;cursor:pointer;font-size:14px;transition:all .2s;text-align:left;line-height:1.45;color:#2d3748}
.opt:hover:not(:disabled){background:#ebf8ff;border-color:#63b3ed}
.opt.correct{background:#f0fff4;border-color:#48bb78;color:#22543d}
.opt.wrong{background:#fff5f5;border-color:#fc8181;color:#742a2a}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.6;animation:fadeIn .3s}
.fb-ok{background:#f0fff4;border:1.5px solid #68d391;color:#22543d}
.fb-err{background:#fff5f5;border:1.5px solid #fc8181;color:#742a2a}
.fb-title{font-size:15px;font-weight:600;display:block;margin-bottom:6px}
.correct-ans{color:#276749;font-style:italic;display:block;margin:6px 0}
.next-btn{width:100%;background:#2b6cb0;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px}
.next-btn:hover{background:#2c5282}
#results{display:none;text-align:center;padding:20px}
.result-circle{width:120px;height:120px;border-radius:50%;margin:20px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff}
.result-label{font-size:12px;font-weight:400;margin-top:2px}
.result-msg{font-size:20px;font-weight:600;margin:12px 0 6px;color:#1a365d}
.result-sub{color:#4a5568;font-size:14px;margin-bottom:24px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-p{background:#2b6cb0;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer}
.btn-s{background:#fff;color:#2d3748;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer}
.stats-row{display:flex;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.stat-box{background:#fff;border-radius:10px;padding:14px 20px;min-width:100px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stat-num{font-size:26px;font-weight:700}
.stat-lbl{font-size:11px;color:#718096;margin-top:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .3s ease}
</style>
</head>
<body>
<div id="app">
<div id="home">
  <div class="logo">🔥</div>
  <h1>Quiz Antincendio</h1>
  <p class="subtitle">Preparazione sicurezza antincendio — D.Lgs. 81/2008</p>
  <div class="section-title">Modalità</div>
  <div class="mode-grid">
    <div class="mode-card" onclick="startQuiz('all')">
      <div class="icon">📚</div><h3>Quiz Generale</h3>

    <button class="back-btn" onclick="goHome()">← Indietro</button>

    <div class="stat-box"><div class="stat-num" id="rW" style="color:#c53030"></div><div class="stat-lbl">Errate ✗</div></div>
    <div class="stat-box"><div class="stat-num" id="rT" style="color:#2b6cb0"></div><div class="stat-lbl">Totale</div></div>
  </div>
  <div class="result-actions">
    <button class="btn-p" onclick="restartSame()">🔄 Riprova</button>
    <button class="btn-s" onclick="goHome()">🏠 Menu</button>

</div>

<script>
// Domande ESATTE dal file originale
// Formato: [domanda, risposta_corretta, [sbagliate...], motivo_corretto, {0:motivo_sbagliata_0, 1:..., 2:...}, topic]
const Q=[
["Si definisce combustione:","Qualunque reazione chimica nella quale un combustibile, sostanza ossidabile, reagisce con un comburente, sostanza ossidante, liberando energia, in genere sotto forma di calore",["La trasformazione che un materiale subisce nella sua forma, senza che venga alterata la sua natura chimica","Una reazione nella quale si libera solo luce senza calore","Un processo fisico di raffreddamento spontaneo"],"La combustione è per definizione una reazione chimica esotermica tra un combustibile ossidabile e un comburente ossidante, con liberazione di energia sotto forma di calore.",{0:"Quella è la definizione di trasformazione FISICA, non di combustione.",1:"La combustione libera sia calore sia luce; non è un processo puramente luminoso.",2:"La combustione PRODUCE calore; non è un raffreddamento."},"combustione"],

["Affinché la reazione di combustione abbia luogo è necessaria la presenza di una fonte di innesco, cioè:","Di una sorgente di calore che fornisca la necessaria energia di attivazione in grado di attivare la reazione di combustione",["Di una adeguata fiamma libera che, lambendo il materiale combustibile, dia la necessaria energia per l'avvio dell'incendio non per forza superiore all'energia di attivazione","Di una adeguata percentuale di ossigeno nell'aria","Solo della presenza di materiale combustibile"],"La sorgente di innesco deve fornire l'energia di attivazione, cioè la soglia minima energetica per avviare la reazione.",{0:"Non è corretto: la sorgente DEVE superare l'energia di attivazione, non può essere 'non per forza superiore'.",1:"L'ossigeno è il comburente, non la fonte di innesco.",2:"Il solo combustibile non basta senza innesco e comburente."},"combustione"],

["Affinché la reazione di combustione abbia inizio, deve sempre verificarsi:","La contemporanea presenza del combustibile, del comburente e dell'innesco/sorgente di calore",["La contemporanea presenza del combustibile e del comburente","La presenza del solo combustibile in quantità elevata","La contemporanea presenza del combustibile e della giusta temperatura o innesco"],"Il 'triangolo del fuoco' richiede TUTTI e TRE gli elementi: combustibile, comburente e innesco. La mancanza di uno solo impedisce la combustione.",{0:"Senza innesco/sorgente di calore non si avvia la reazione.",1:"Il solo combustibile è insufficiente; mancano comburente e innesco.",2:"Manca il comburente come elemento esplicito; tutti e tre devono essere presenti contemporaneamente."},"combustione"],

["In caso di mancata presenza di uno degli elementi del 'triangolo del fuoco' (combustibile, comburente e innesco/sorgente di calore):","La reazione di combustione (incendio) non ha luogo",["La reazione di combustione (incendio) può avvenire lo stesso con percentuali elevate di ossigeno in aria","La reazione avviene con produzione solo di fumo","La reazione avviene più lentamente"],"Il triangolo del fuoco è esaustivo: se manca anche solo uno dei tre elementi, la combustione è IMPOSSIBILE.",{0:"Anche con ossigeno in eccesso, senza combustibile o senza innesco la combustione non avviene.",1:"Non si produce fumo senza combustione.",2:"Senza uno degli elementi la reazione NON avviene affatto, non solo rallenta."},"combustione"],

["La propagazione della combustione richiede la presenza contemporanea di:","Combustibile, comburente e temperatura adeguata",["Combustibili e temperatura adeguata","Comburente e temperatura adeguata","Solo combustibile e comburente"],"Anche per propagarsi, la combustione richiede i tre elementi del triangolo del fuoco: combustibile, comburente e temperatura adeguata.",{0:"Senza comburente (ossigeno) la combustione non si propaga.",1:"Senza combustibile non c'è nulla che bruci.",2:"Senza temperatura adeguata la reazione si estingue."},"combustione"],

["Il combustibile è:","Qualunque sostanza che, ossidandosi, partecipa alla reazione chimica di combustione",["Qualunque sostanza ossidante, in genere l'ossigeno presente nell'aria, che partecipa alla reazione di combustione","Una sostanza che a contatto con altre sostanze combustibili provoca una reazione endotermica","Solo le sostanze allo stato solido"],"Il combustibile è la sostanza che si OSSIDA (reagisce con il comburente) liberando energia.",{0:"La sostanza ossidante è il COMBURENTE, non il combustibile.",1:"La combustione è ESOTERMICA (libera calore), non endotermica; inoltre descrive il comburente.",2:"I combustibili possono essere solidi, liquidi o gassosi."},"combustione"],

["Il comburente è:","Una sostanza che a contatto con altre sostanze combustibili provoca una reazione esotermica",["Qualunque sostanza ossidante, in genere l'ossigeno presente nell'aria, che partecipa alla reazione di combustione","Una sostanza che a contatto con altre sostanze comburenti provoca una reazione esotermica","Una sostanza che a contatto con altre sostanze combustibili provoca una reazione endotermica"],"Il comburente (tipicamente l'ossigeno) reagisce con il combustibile in una reazione esotermica (libera calore).",{0:"Quella è la definizione corretta del COMBUSTIBILE, non del comburente.",1:"Il comburente reagisce con il COMBUSTIBILE, non con altri comburenti.",2:"La combustione è ESOTERMICA, non endotermica."},"combustione"],

["Per ottenere lo spegnimento dell'incendio si può ricorrere solo al raffreddamento?","No, si può ricorrere all'esaurimento del combustibile, al soffocamento, al raffreddamento o all'inibizione chimica",["Si, il raffreddamento è l'unico metodo efficace","Si, ma solo in combinazione con il soffocamento","No, si può ricorrere solo al soffocamento"],"Esistono quattro metodi: esaurimento combustibile, soffocamento, raffreddamento e inibizione chimica.",{0:"Il raffreddamento è solo UNO dei quattro metodi.",1:"I metodi sono quattro, non solo due.",2:"Mancano il raffreddamento e l'inibizione chimica."},"combustione"],

["Per ottenere lo spegnimento dell'incendio si può ricorrere all'esaurimento del combustibile, che consiste:","Nell'allontanamento o separazione della sostanza combustibile dal focolaio d'incendio",["Nella sottrazione di calore fino ad ottenere una temperatura inferiore a quella necessaria al mantenimento della combustione","Nella separazione del comburente dal combustibile o riduzione della concentrazione di comburente in aria","Nell'inibizione chimica della reazione di combustione"],"L'esaurimento del combustibile rimuove fisicamente il materiale che brucia dal focolaio.",{0:"Quella è la definizione del RAFFREDDAMENTO.",1:"Quella è la definizione del SOFFOCAMENTO.",2:"Quella è la definizione dell'INIBIZIONE CHIMICA."},"combustione"],

["Per ottenere lo spegnimento dell'incendio si può ricorrere al soffocamento, che consiste:","Nella separazione del comburente dal combustibile o riduzione della concentrazione di comburente in aria",["Nell'allontanamento o separazione della sostanza combustibile dal focolaio d'incendio","Nella sottrazione di calore fino ad ottenere una temperatura inferiore a quella necessaria al mantenimento della combustione","Nell'inibizione chimica della reazione di combustione"],"Il soffocamento priva la combustione dell'ossigeno necessario separando il comburente dal combustibile.",{0:"Quella è la definizione dell'ESAURIMENTO DEL COMBUSTIBILE.",1:"Quella è la definizione del RAFFREDDAMENTO.",2:"Quella è la definizione dell'INIBIZIONE CHIMICA."},"combustione"],

["Per ottenere lo spegnimento dell'incendio si può ricorrere al raffreddamento, che consiste:","Nella sottrazione di calore fino ad ottenere una temperatura inferiore a quella necessaria al mantenimento della combustione",["Nell'allontanamento o separazione della sostanza combustibile dal focolaio d'incendio","Nella separazione del comburente dal combustibile o riduzione della concentrazione di comburente in aria","Nell'inibizione chimica della reazione di combustione"],"Il raffreddamento abbassa la temperatura sotto quella di accensione, interrompendo la reazione.",{0:"Quella è la definizione dell'ESAURIMENTO DEL COMBUSTIBILE.",1:"Quella è la definizione del SOFFOCAMENTO.",2:"Quella è la definizione dell'INIBIZIONE CHIMICA."},"combustione"],

["Gli incendi, in relazione allo stato chimico-fisico dei materiali combustibili, si distinguono in classi:","Si, in cinque classi: A, B, C, D ed F",["No, si distinguono in categorie: 1, 2, 3, 4 e 5","Si, in tre classi: A, B e C","No, si distinguono in sei classi: A, B, C, D, E ed F"],"Il sistema europeo prevede 5 classi: A (solidi con braci), B (liquidi), C (gas), D (metalli), F (olii da cucina).",{0:"Le categorie 1-5 riguardano i LIQUIDI INFIAMMABILI, non le classi di incendio.",1:"Le classi sono CINQUE (A,B,C,D,F), non tre.",2:"Non esiste una classe E per gli incendi; le classi sono A,B,C,D,F."},"classi"],

["Gli incendi di Classe A, in relazione allo stato fisico dei materiali combustibili, sono:","Incendi di materiali solidi con formazione di braci (carta, cartoni, libri, legna, segatura, ….)",["Incendi di liquidi infiammabili e solidi che possono liquefare (petrolio, vernici, nafta, benzina ….)","Incendi di gas infiammabili (metano, propano, g.p.l., cloro, idrogeno ….)","Incendi di metalli combustibili (magnesio, potassio, sodio …)"],"Classe A: combustibili solidi comuni (carta, legno, tessuti) che lasciano braci durante la combustione.",{0:"I liquidi infiammabili appartengono alla CLASSE B.",1:"I gas infiammabili appartengono alla CLASSE C.",2:"I metalli combustibili appartengono alla CLASSE D."},"classi"],

["Gli incendi di Classe B, in relazione allo stato fisico dei materiali combustibili, sono:","Incendi di liquidi infiammabili e solidi che possono liquefare (petrolio, vernici, nafta, benzina ….)",["Incendi di materiali solidi con formazione di braci (carta, cartoni, libri, legna, segatura, ….)","Incendi di gas infiammabili (metano, propano, g.p.l., cloro, idrogeno ….)","Incendi che interessano sostanze usate nella cottura (oli e grassi vegetali o animali)"],"Classe B: liquidi infiammabili (benzina, nafta, vernici) e solidi a basso punto di fusione.",{0:"I solidi con braci sono CLASSE A.",1:"I gas infiammabili sono CLASSE C.",2:"Gli olii da cucina sono CLASSE F."},"classi"],

["Gli incendi di Classe C, in relazione allo stato fisico dei materiali combustibili, sono:","Incendi di gas infiammabili (metano, propano, g.p.l., cloro, idrogeno ….)",["Incendi di materiali solidi con formazione di braci (carta, cartoni, libri, legna, segatura, ….)","Incendi di liquidi infiammabili e solidi che possono liquefare (petrolio, vernici, nafta, benzina ….)","Incendi di metalli combustibili (magnesio, potassio, sodio …)"],"Classe C: esclusivamente gas infiammabili. Lo spegnimento deve prevedere l'interruzione del flusso del gas.",{0:"I materiali solidi con braci sono CLASSE A.",1:"I liquidi infiammabili sono CLASSE B.",2:"I metalli combustibili sono CLASSE D."},"classi"],

["Gli incendi di Classe D, in relazione allo stato fisico dei materiali combustibili, sono:","Incendi di metalli combustibili e sostanze chimiche contenenti ossigeno comburente (magnesio, potassio, fosforo, sodio, titanio, alluminio, carburi, nitrati, clorati, perclorati, perossidi ….)",["Incendi di materiali solidi con formazione di braci (carta, cartoni, libri, legna, segatura, ….)","Incendi di liquidi infiammabili e solidi che possono liquefare","Incendi che interessano sostanze usate nella cottura (oli e grassi vegetali o animali)"],"Classe D: metalli combustibili, molto reattivi e difficili da spegnere con agenti estinguenti comuni.",{0:"I solidi con braci sono CLASSE A.",1:"I liquidi infiammabili sono CLASSE B.",2:"Gli olii da cucina sono CLASSE F."},"classi"],

["Gli incendi di Classe F, in relazione allo stato fisico dei materiali combustibili, sono:","Incendi che interessano sostanze usate nella cottura (oli e grassi vegetali o animali)",["Incendi di materiali solidi con formazione di braci (carta, cartoni, libri, legna, segatura, ….)","Incendi di gas infiammabili (metano, propano, g.p.l., cloro, idrogeno ….)","Incendi di metalli combustibili (magnesio, potassio, sodio …)"],"Classe F: fuochi in cucina (friggitrici, forni) dove oli e grassi ad alta temperatura richiedono agenti estinguenti specifici.",{0:"I solidi con braci sono CLASSE A.",1:"I gas infiammabili sono CLASSE C.",2:"I metalli combustibili sono CLASSE D."},"classi"],

["Il combustibile, sostanza che si trasforma durante l'incendio, può trovarsi allo stato solido, liquido o gassoso:","Si, i combustibili possono trovarsi in uno dei tre stati (combustibile solido, liquido o gassoso)",["No, i combustibili sono sostanze solo allo stato solido","No, i combustibili sono sostanze che possono essere solo allo stato solido o liquido","No, i combustibili sono sostanze che possono essere solo allo stato liquido o gassoso"],"I combustibili possono essere in tutti e tre gli stati: legno/carta (solido), benzina (liquido), metano (gassoso).",{0:"Esclude benzina, metano e molti altri combustibili.",1:"Esclude i combustibili gassosi come metano, GPL, idrogeno.",2:"Esclude i combustibili solidi come legno, carta, carbone."},"combustione"],

["La temperatura in corrispondenza della quale si verifica la combustione è definita:","Temperatura di infiammabilità",["Temperatura di ebollizione","Temperatura di accensione o temperatura di ignizione","Temperatura di fusione"],"La temperatura di infiammabilità (flash point) è la minima temperatura alla quale un liquido sviluppa vapori infiammabili sufficienti in presenza di innesco.",{0:"Il punto di ebollizione riguarda il cambio di stato fisico, non l'infiammabilità.",1:"La temperatura di accensione è quella di AUTOIGNIZIONE (senza innesco esterno); è un parametro diverso.",2:"La temperatura di fusione riguarda il passaggio da solido a liquido."},"combustione"],

["La più bassa temperatura alla quale un combustibile liquido sviluppa vapori in quantità sufficiente da formare con l'aria una miscela che, in presenza di innesco, si accende è definita:","Temperatura di infiammabilità",["Temperatura di combustione o accensione","Temperatura di ebollizione","Temperatura di fusione"],"La temperatura di infiammabilità (flash point) è la soglia minima per la formazione di miscele infiammabili sopra la superficie del liquido in presenza di innesco.",{0:"La temperatura di accensione è quella di autoignizione senza innesco esterno; è diversa.",1:"Il punto di ebollizione è il passaggio completo allo stato vapore.",2:"La temperatura di fusione riguarda il passaggio da solido a liquido."},"combustione"],

["In presenza di liquidi infiammabili (combustibili), la probabilità che si formino vapori in quantità tali da essere incendiati aumenta con il diminuire della temperatura di infiammabilità:","Si",["No, aumenta con l'aumentare della temperatura di infiammabilità","No, non varia al variare della temperatura di infiammabilità","Dipende dal tipo di liquido"],"Più bassa è la temperatura di infiammabilità, più facilmente il liquido produce vapori infiammabili già a temperatura ambiente.",{0:"È vero il CONTRARIO: bassa temperatura di infiammabilità = MAGGIOR pericolo.",1:"La temperatura di infiammabilità è il parametro fondamentale per il rischio.",2:"Il principio è universale per tutti i liquidi infiammabili."},"combustione"],

["Un liquido 'infiammabile' (combustibile), ai fini del rischio incendio/esplosione:","È più pericoloso se ha basse temperature di infiammabilità",["È più pericoloso se ha alte temperature di infiammabilità","La pericolosità dei liquidi infiammabili non dipendente dalla temperatura di infiammabilità","È ugualmente pericoloso a qualsiasi temperatura di infiammabilità"],"Flash point basso = vapori infiammabili anche a temperatura ambiente = maggior pericolo.",{0:"Un liquido con alta temperatura di infiammabilità è MENO pericoloso.",1:"La temperatura di infiammabilità è il criterio principale per la pericolosità.",2:"La temperatura di infiammabilità determina la pericolosità."},"combustione"],

["Con limiti di infiammabilità di una sostanza (gassosa o allo stato aeriforme) si intende:","La percentuale in volume di combustibile nella miscela aria – combustibile",["La percentuale in volume di comburente nella miscela aria-combustibile","La temperatura in corrispondenza della quale un liquido combustibile è in grado di emettere vapori in quantità sufficiente da formare con l'aria una miscela che, in presenza di innesco, si accende","Il rapporto tra massa del combustibile e volume dell'ambiente"],"I limiti di infiammabilità (LII e LSI) definiscono l'intervallo di concentrazione volumetrica del COMBUSTIBILE nell'aria entro cui la miscela è infiammabile.",{0:"I limiti riguardano la concentrazione del COMBUSTIBILE, non del comburente.",1:"Quella è la definizione della TEMPERATURA DI INFIAMMABILITÀ.",2:"Non è un rapporto massa/volume: è la percentuale volumetrica del gas nella miscela."},"combustione"],

["Il 'limite inferiore di infiammabilità' di una sostanza (gassosa o allo stato aeriforme):","Rappresenta la minima concentrazione di combustibile, in fase gas, presente nella miscela aria – combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una combustione in grado di propagarsi a tutta la miscela",["Rappresenta la minima concentrazione di comburente, in fase gas, presente nella miscela aria combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una combustione in grado di propagarsi a tutta la miscela","Rappresenta la massima concentrazione di combustibile, in fase gas, nella miscela aria-combustibile","La percentuale minima di ossigeno necessaria per la combustione"],"Sotto il LII la miscela è troppo POVERA di combustibile (miscela magra) per bruciare.",{0:"Il LII riguarda la concentrazione del COMBUSTIBILE, non del comburente.",1:"La concentrazione MASSIMA è il LIMITE SUPERIORE di infiammabilità (LSI).",2:"Il LII riguarda il combustibile, non l'ossigeno."},"combustione"],

["Il 'limite superiore di infiammabilità' di una sostanza (gassosa o allo stato aeriforme):","Rappresenta la massima concentrazione di combustibile, in fase gas, presente nella miscela aria-combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una combustione in grado di propagarsi a tutta la miscela",["Rappresenta la minima concentrazione di comburente, in fase gas, presente nella miscela aria combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una combustione in grado di propagarsi a tutta la miscela","Rappresenta la minima concentrazione di combustibile, in fase gas, nella miscela aria-combustibile","La percentuale massima di ossigeno tollerabile in un ambiente chiuso"],"Sopra il LSI la miscela è troppo RICCA di combustibile per bruciare.",{0:"Il LSI riguarda la concentrazione MASSIMA del COMBUSTIBILE, non del comburente.",1:"La concentrazione MINIMA è il LIMITE INFERIORE (LII).",2:"Il LSI riguarda la concentrazione del combustibile, non dell'ossigeno."},"combustione"],

["Con il termine 'campo di infiammabilità' intendiamo:","L'intervallo di concentrazione 'miscela aria – combustibile' compreso fra il limite inferiore di infiammabilità ed il limite superiore, caratteristici per ciascuna sostanza",["La temperatura massima raggiungibile in un incendio","L'area fisica in cui può diffondersi un incendio","L'intervallo di temperature in corrispondenza della quale un liquido combustibile o un gas si innescano"],"Il campo di infiammabilità è l'intervallo di concentrazioni percentuali del combustibile nell'aria entro cui la miscela brucia.",{0:"La temperatura massima teorica è la temperatura adiabatica di fiamma; diversa dal campo di infiammabilità.",1:"È un parametro chimico (% volumetrica), non un'area fisica.",2:"Si tratta di un intervallo di CONCENTRAZIONI, non di temperature."},"combustione"],

["La temperatura di accensione rappresenta:","La minima temperatura alla quale un combustibile liquido sviluppa vapori in quantità tale da formare con l'aria una miscela che, in presenza di innesco, brucia spontaneamente",["Rappresenta la minima temperatura alla quale una sostanza combustibile, in presenza di aria inizia a bruciare spontaneamente in modo continuo senza necessità di innesco","Rappresenta la temperatura in corrispondenza della quale un liquido va in ebollizione","La temperatura di infiammabilità del liquido"],"La temperatura di accensione (secondo questa domanda del file) è la minima T alla quale un liquido emette vapori che bruciano in presenza di innesco.",{0:"Quella è la definizione di AUTOIGNIZIONE (temperatura di accensione spontanea senza innesco).",1:"Il punto di ebollizione riguarda il cambio di stato fisico.",2:"La temperatura di infiammabilità e quella di accensione sono parametri distinti."},"combustione"],

["Il campo di esplosività rappresenta:","L'intervallo nel quale la percentuale in volume di miscela aria-combustibile se innescata da origine ad una reazione di combustione",["L'intervallo nel quale la percentuale in volume di miscela aria-combustibile se innescata da origine ad una esplosione","L'intervallo nel quale la percentuale in volume di miscela aria-combustibile se innescata da origine solo ad una detonazione","La percentuale massima di combustibile tollerabile in un locale chiuso"],"Il campo di esplosività coincide con il campo di infiammabilità: è l'intervallo di concentrazioni entro cui la miscela brucia se innescata.",{0:"Non solo esplosione: comprende tutte le combustioni rapide.",1:"Non solo detonazione: comprende anche le deflagrazioni.",2:"Non è una percentuale tollerabile ma l'intervallo in cui la miscela è reattiva."},"combustione"],

["Il Limite inferiore di esplosività è:","La minima concentrazione di combustibile, in fase gas, presente nella miscela aria-combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una esplosione",["La massima concentrazione di combustibile nella miscela aria-combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una esplosione","La minima concentrazione di comburente nella miscela aria-combustibile","La percentuale minima di ossigeno necessaria per la combustione"],"Il LIE è la concentrazione minima di combustibile gassoso al di sotto della quale la miscela è troppo povera per esplodere.",{0:"La concentrazione MASSIMA è il LIMITE SUPERIORE di esplosività (LSE).",1:"Il LIE riguarda la concentrazione del COMBUSTIBILE, non del comburente.",2:"Riguarda la concentrazione del combustibile, non dell'ossigeno."},"combustione"],

["Il Limite superiore di esplosività è:","La massima concentrazione di combustibile, in fase gas, presente nella miscela aria-combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una esplosione",["La minima concentrazione di combustibile, in fase gas, presente nella miscela aria-combustibile che consente a quest'ultima, se innescata, di reagire dando luogo ad una esplosione","La minima concentrazione di comburente nella miscela","La percentuale massima di ossigeno tollerabile in un ambiente chiuso"],"Il LSE è la concentrazione massima del combustibile: sopra questa soglia la miscela è troppo ricca per esplodere.",{0:"La concentrazione MINIMA è il LIMITE INFERIORE di esplosività (LIE).",1:"Il LSE riguarda la concentrazione MASSIMA del COMBUSTIBILE, non il minimo.",2:"Riguarda la concentrazione del combustibile, non dell'ossigeno."},"combustione"],

["La combustione delle sostanze solide è caratterizzata dai seguenti parametri:","Tipologia, pezzatura e forma del materiale",["Grado di porosità contenuto dell'umidità del materiale e ventilazione","Da tutti i parametri indicati negli altri due punti","Solo dalla composizione chimica del materiale"],"Per i solidi: tipologia (natura chimica), pezzatura (superficie esposta) e forma geometrica determinano il comportamento alla combustione.",{0:"Porosità, umidità e ventilazione influenzano la combustione ma non sono i parametri caratterizzanti primari.",1:"I parametri principali sono tipologia, pezzatura e forma; gli altri sono fattori secondari.",2:"La sola composizione chimica non basta; pezzatura e forma influenzano fortemente la velocità di combustione."},"combustione"],

["Per i combustibili liquidi, la reazione di combustione, in presenza di innesco, si genera quando:","Il liquido emette una quantità di vapori sufficienti, opportunamente miscelati con l'aria",["Il liquido a una bassa temperatura di combustione o accensione","Il liquido non è chiuso in un contenitore metallico","Il liquido raggiunge la temperatura di ebollizione"],"I liquidi non bruciano direttamente: bruciano i VAPORI emessi. La combustione avviene quando i vapori sono nel campo di infiammabilità.",{0:"La bassa temperatura di accensione è un fattore di pericolosità, non la condizione di innesco.",1:"Il contenitore non è il fattore determinante; sono i vapori miscelati con l'aria.",2:"Non è necessaria l'ebollizione: basta raggiungere la temperatura di infiammabilità."},"combustione"],

["In funzione della temperatura di infiammabilità i liquidi combustibili:","Vengono raggruppati in cinque classi: A, B, C, D ed F",["Vengono raggruppati in cinque classi: 1, 2, 3, 4 e 5","Vengono raggruppati in tre categorie: A, B e C","Non vengono classificati in base alla temperatura di infiammabilità"],"I liquidi infiammabili sono classificati in categorie in base alla temperatura di infiammabilità secondo la normativa.",{0:"Le categorie per i liquidi infiammabili usano lettere (A,B,C), non numeri.",1:"Le categorie sono più di tre secondo la normativa vigente.",2:"La temperatura di infiammabilità è il criterio principale di classificazione."},"classi"],

["I liquidi di categoria 'A' sono:","I liquidi aventi temperatura di infiammabilità inferiore a 21°C",["I liquidi aventi temperatura di infiammabilità compresa tra 21°C e 65°C","I liquidi aventi temperatura di infiammabilità oltre 65° e fino a 125°C","I liquidi non infiammabili"],"Categoria A: i più pericolosi (es. benzina, acetone, etere) con vapori infiammabili già a temperatura ambiente.",{0:"La fascia 21-65°C è la categoria B.",1:"I liquidi con flash point >65°C sono categoria C.",2:"I liquidi non infiammabili non rientrano in questa classificazione."},"classi"],

["I liquidi di categoria 'B' sono:","I liquidi aventi temperatura di infiammabilità compresa tra 21°C e 65°C",["I liquidi aventi temperatura di infiammabilità inferiore a 21°C","I liquidi aventi temperatura di infiammabilità oltre 65° e fino a 125°C","I liquidi aventi punto di ebollizione inferiore a 35°C"],"Categoria B: es. kerosene, alcuni solventi. Richiedono temperature superiori a quelle ambientali per produrre vapori infiammabili.",{0:"Temperatura <21°C è la categoria A (più pericolosa).",1:"La fascia >65°C è la categoria C.",2:"Il punto di ebollizione non è il criterio di classificazione."},"classi"],

["I liquidi di categoria 'C' sono:","I liquidi aventi temperatura di infiammabilità oltre 65° e fino a 125°C",["I liquidi aventi temperatura di infiammabilità inferiore a 21°C","I liquidi aventi temperatura di infiammabilità compresa tra 21°C e 65°C","I liquidi aventi temperatura di ebollizione superiore a 100°C"],"Categoria C: es. oli lubrificanti. Richiedono temperature molto elevate per produrre vapori infiammabili.",{0:"Temperatura <21°C è la categoria A.",1:"La fascia 21-65°C è la categoria B.",2:"Il punto di ebollizione non è il criterio di classificazione."},"classi"],

["I combustibili gassosi possono essere conservati:","In quattro modalità diverse (compressi, liquefatti, refrigerati o criogenici, disciolti) a seconda delle loro caratteristiche chimico-fisiche ed in particolare della temperatura critica",["In due modalità diverse (compressi o liquefatti) a seconda delle loro caratteristiche fisiche ed in particolare della temperatura critica","Solo liquefatti","In tre modalità: compressi, liquefatti o disciolti"],"Le quattro modalità: metano→compresso, GPL→liquefatto, azoto/ossigeno→criogenico, acetilene→disciolto in acetone.",{0:"Sono quattro le modalità, non solo due.",1:"La liquefazione è solo una delle quattro modalità.",2:"Mancano i gas refrigerati/criogenici."},"combustione"],

["I combustibili gassosi sono:","Quelle sostanze che si trovano allo stato gassoso nelle condizioni normali di pressione e di temperatura (pressione atmosferica e temperatura di circa 15°C)",["Quelle sostanze che si trovano allo stato gassoso nelle condizioni alta pressione e di alta temperatura (almeno pressione di 10 bar e temperatura di circa 100°C)","I combustibili che, a seguito della reazione di combustione, si trasformano in sostanze gassose","Solo i gas naturali estratti dal sottosuolo"],"I combustibili gassosi sono sostanze già allo stato gassoso a pressione atmosferica e ~15°C (condizioni normali).",{0:"Le condizioni normali sono 1 atm e ~15°C, NON 10 bar e 100°C.",1:"Una descrizione imprecisa; il criterio è lo stato fisico nelle condizioni normali.",2:"Anche gas artificiali (idrogeno, acetilene) sono combustibili gassosi."},"combustione"],

["I combustibili gassosi, in relazione alla densità relativa all'aria, sono classificati gas pesanti:","Se la densità relativa all'aria è maggiore di 0.8 (es. GPL, acetilene,ecc.)",["Se la densità relativa all'aria è minore di 0.8 (es. metano,ecc.)","Se la densità è uguale a quella dell'acqua","Se hanno temperatura di ebollizione negativa"],"Gas pesanti (GPL, propano) tendono a raccogliersi in basso, pericolosi in cantine e locali sotterranei.",{0:"Densità <0,8 indica gas LEGGERI come metano e idrogeno.",1:"La densità relativa si confronta con l'ARIA, non con l'acqua.",2:"La temperatura di ebollizione non è il criterio."},"combustione"],

["I combustibili gassosi, in relazione alla densità relativa all'aria, sono classificati gas leggeri:","Se la densità relativa all'aria è minore di 0.8 (es. metano,ecc.)",["Se la densità relativa all'aria è maggiore di 0.8 (es. GPL, acetilene,ecc.)","Se la densità è maggiore di 1.0","Se hanno temperatura di ebollizione positiva"],"Il metano (densità relativa ~0,55) è più leggero dell'aria: sale e si disperde, riducendo il rischio di accumulo.",{0:"Densità >0,8 indica gas PESANTI come GPL, propano, butano.",1:"Il valore soglia è 0,8, non 1,0.",2:"La temperatura di ebollizione non è il criterio."},"combustione"],

["Il calore:","È la causa principale della propagazione degli incendi",["È un effetto secondario della combustione senza ruolo nella propagazione","È la stessa cosa della temperatura","È un parametro irrilevante per la sicurezza antincendio"],"Il calore si trasmette per conduzione, convezione e irraggiamento, propagando la combustione a nuovi materiali.",{0:"Il calore è la CAUSA PRINCIPALE della propagazione.",1:"Calore e temperatura sono distinti: il calore è energia trasferita, la temperatura misura lo stato termico.",2:"Il calore è il fattore determinante nella propagazione."},"combustione"],

["I meccanismi con cui una sorgente d'ignizione può scambiare calore con un combustibile sono:","Conduzione, convezione e irraggiamento",["Solo conduzione e convezione","Solo irraggiamento e convezione","Solo irraggiamento"],"I tre meccanismi fondamentali: conduzione (contatto diretto), convezione (moto di fluidi), irraggiamento (onde elettromagnetiche).",{0:"Manca l'irraggiamento, fondamentale per la propagazione a distanza.",1:"Manca la conduzione, importante per la propagazione attraverso i solidi.",2:"Conduzione e convezione sono altrettanto importanti."},"combustione"],

["Le principali sorgenti di attivazione dell'incendio sono:","Tutte quelle indicate negli altri punti",["Attrito, radiazioni termiche, reazioni chimiche esotermiche e autocombustione","Fiamme, Superfici calde e scintille e archi elettrici","Solo fiamme libere e scintille elettriche"],"Le sorgenti di innesco sono molteplici: fiamme, superfici calde, scintille, archi elettrici, attrito, radiazioni termiche, autocombustione, reazioni chimiche.",{0:"Queste sono solo alcune sorgenti; mancano fiamme, superfici calde, scintille elettriche.",1:"Queste sono solo alcune sorgenti; mancano attrito, autocombustione, reazioni chimiche.",2:"Le sorgenti di innesco sono molto più numerose."},"combustione"],

["Si ha calore per attrito:","Quando si ha sfregamento tra due materiali",["Quando una fiamma, una scintilla o altro materiale incandescente entra in contatto con un materiale combustibile in presenza di ossigeno","Quando il calore d'innesco avviene nelle forme della convezione, conduzione e irraggiamento termico","Quando si ha autocombustione"],"L'attrito genera calore per conversione di energia meccanica in termica (es. macchinari, cinghie di trasmissione).",{0:"Quella è l'accensione per contatto diretto con fiamma/scintilla, non per attrito.",1:"Quella è la descrizione generale dei meccanismi di trasmissione del calore.",2:"L'autocombustione è una sorgente di calore diversa dall'attrito."},"combustione"],

["Si ha autocombustione o riscaldamento spontaneo:","Quando il calore viene prodotto dallo stesso combustibile che si innesca senza sorgenti esterne di attivazione",["Quando una fiamma libera tocca il materiale","Quando il calore viene trasmesso per conduzione da una superficie calda","Quando si ha sfregamento tra due materiali"],"L'autocombustione avviene in materiali che producono calore internamente (es. fieno bagnato, carbone) fino a raggiungere la temperatura di ignizione.",{0:"Quella è l'accensione per contatto con fiamma esterna.",1:"Quella è l'accensione per conduzione termica da sorgente esterna.",2:"Quello è il calore da attrito."},"combustione"],

["Il calore radiante emesso da caminetti e stufe può innescare un incendio?","Si, se il materiale investito dalla radiazione termica raggiunge la temperatura di accensione",["No, il calore radiante non può innescare un incendio","Solo se la distanza è inferiore a 10 cm","Solo se il materiale è carta o tessuto"],"L'irraggiamento termico può trasferire calore sufficiente a innescare materiali combustibili anche a distanza.",{0:"Il calore radiante è uno dei meccanismi di trasmissione del calore e PUÒ certamente innescare un incendio.",1:"Non esiste una soglia di distanza fissa; dipende dalla potenza della sorgente.",2:"Qualsiasi materiale combustibile può essere innescato se raggiunge la sua temperatura di accensione."},"combustione"],

["A seguito di una reazione di combustione si ha produzione di:","Gas e fumi",["Solo calore e luce","Calore, fiamme e vapore acqueo","Solo vapore acqueo"],"La combustione produce gas (CO2, CO, H2O vapore) e fumi (particelle solide/liquide in sospensione), oltre a calore e luce.",{0:"Si producono anche gas e fumi, non solo calore e luce.",1:"Calore e fiamme sono manifestazioni della combustione; i prodotti principali sono gas e fumi.",2:"Il vapore acqueo è solo uno dei gas di combustione."},"combustione"],

["I gas di combustione:","Sono quei prodotti della combustione che rimangono allo stato gassoso anche quando raggiungono, raffreddandosi, la temperatura ambiente di riferimento (15°C)",["È la quantità di aria necessaria per raggiungere la combustione completa di una determinata quantità di combustibile","Sono quei prodotti allo stato gassoso che si hanno prima della reazione di combustione","Sono formati da piccolissime particelle solide disperse nei gas"],"I gas di combustione (CO2, CO, H2O, SO2, ecc.) rimangono gassosi anche a temperatura ambiente.",{0:"Quella è la definizione dell'ARIA STECHIOMETRICA, non dei gas di combustione.",1:"I gas pre-combustione sono diversi dai gas prodotti dalla reazione.",2:"Quella è la definizione dei FUMI, non dei gas di combustione."},"combustione"],

["Le fiamme sono:","Sono costituite dall'emissione di luce come reazione conseguente alla combustione di gas sviluppatosi in un incendio",["Formati da piccolissime particelle solide (aerosol), liquide (nebbie o vapori condensati) disperse nei gas prodotti durante la combustione","Sono quei prodotti della combustione che rimangono allo stato gassoso","Solo il calore visibile prodotto durante la combustione"],"Le fiamme sono la zona luminosa della combustione dove i gas reagiscono con l'ossigeno con emissione di luce e calore.",{0:"Quella è la definizione dei FUMI.",1:"Quella è la definizione dei GAS di combustione.",2:"Le fiamme non sono solo calore; sono la zona di reazione luminosa."},"combustione"],

["I fumi sono:","Formati da piccolissime particelle solide (aerosol), liquide (nebbie o vapori condensati) disperse nei gas prodotti durante la combustione",["Sono quei prodotti della combustione che rimangono allo stato gassoso anche quando raggiungono la temperatura ambiente","Sono costituite dall'emissione di luce come reazione conseguente alla combustione","Solo vapore acqueo prodotto dalla combustione"],"I fumi sono un aerosol complesso: gas caldi + particelle solide di carbone + goccioline liquide condensate.",{0:"Quelli sono i GAS di combustione; i fumi includono anche particelle solide e liquide.",1:"Le fiamme emettono luce; i fumi sono particelle fisiche sospese.",2:"Il vapore acqueo è solo uno dei gas; i fumi sono più complessi."},"combustione"],

["Le sostanze estinguenti sono:","Sostanze aventi la proprietà di interrompere la combustione",["Sostanze che a contatto con altre sostanze, soprattutto se infiammabili, provocano una forte reazione esotermica","Sostanze che, in presenza di comburenti, possono comunque sostenere un processo di combustione","Sostanze che aumentano la velocità di combustione"],"Le sostanze estinguenti interrompono la combustione agendo su uno o più elementi del triangolo del fuoco.",{0:"Una sostanza che provoca una forte reazione esotermica sarebbe un INNESCO, non un estinguente.",1:"Una sostanza che sostiene la combustione è un COMBUSTIBILE.",2:"Una sostanza che accelera la combustione è un comburente o accelerante."},"estinguenti"],

["Le sostanze estinguenti agiscono sugli incendi, spegnendoli:","Per raffreddamento, sottrazione del combustibile, soffocamento e inibizione chimica",["Per raffreddamento","Per raffreddamento e soffocamento","Per sottrazione di combustibile e soffocamento"],"Quattro meccanismi: raffreddamento, sottrazione del combustibile, soffocamento e inibizione chimica.",{0:"Il raffreddamento è solo UNO dei quattro meccanismi.",1:"Mancano sottrazione del combustibile e inibizione chimica.",2:"Mancano raffreddamento e inibizione chimica."},"estinguenti"],

["I principi di azione di spegnimento degli estinguenti (soffocamento, raffreddamento ….) sono gli stessi per tutte le sostanze che si possono utilizzare?","No, ciascuna sostanza, generalmente, è in grado di esercitare in modo efficace alcune specifiche azione di spegnimento",["Si, ogni sostanza agisce esercitando tutte le azioni di spegnimento allo stesso modo","No, ciascuna sostanza è in grado di esercitare solo un'azione di spegnimento","Si, tutte le sostanze agiscono solo per raffreddamento"],"Acqua→raffredda; CO2→soffoca; polveri→inibizione chimica. Ogni agente ha la sua azione prevalente.",{0:"Ogni sostanza ha azioni specifiche; non tutte agiscono allo stesso modo.",1:"Molte sostanze possono esercitare più di un'azione di spegnimento.",2:"Non tutte le sostanze agiscono per raffreddamento."},"estinguenti"],

["Le sostanze estinguenti normalmente utilizzate sono:","Tutte le sostanze elencate negli altri punti possono essere utilizzate come agenti estinguenti",["Solo l'acqua, la schiuma e le polveri","Solo i gas inerti (Ar, N, CO2)","Solo acqua e CO2"],"Le sostanze estinguenti comprendono: acqua, schiuma, polveri, CO2, gas inerti, clean agents, ecc.",{0:"Esistono molti altri agenti estinguenti oltre ad acqua, schiuma e polveri.",1:"I gas inerti sono solo una categoria.",2:"Acqua e CO2 sono solo due delle numerose sostanze disponibili."},"estinguenti"],

["Nello spegnimento di un incendio, l'acqua, agisce per:","Raffreddamento e soffocamento",["Solo raffreddamento","Solo soffocamento","Inibizione chimica"],"L'acqua ha altissima capacità termica (raffredda) e il vapore prodotto diluisce l'ossigeno (soffoca).",{0:"L'acqua agisce anche per soffocamento tramite il vapore.",1:"L'effetto principale è il raffreddamento; il soffocamento è secondario.",2:"L'inibizione chimica è tipica di polveri speciali e clean agents."},"estinguenti"],

["Nello spegnimento di un incendio, le polveri, agiscono per:","Inibizione chimica",["Raffreddamento e soffocamento","Solo soffocamento","Solo raffreddamento"],"Le polveri estinguenti agiscono principalmente per INIBIZIONE CHIMICA della catena di radicali liberi della combustione.",{0:"Raffreddamento e soffocamento sono l'azione principale dell'acqua e della CO2.",1:"Il soffocamento è l'azione principale della CO2.",2:"Il raffreddamento è l'azione principale dell'acqua."},"estinguenti"],

["Nello spegnimento di un incendio, i gas inerti, come Azoto e Argon, agiscono per:","Soffocamento",["Raffreddamento","Inibizione chimica","Raffreddamento e soffocamento"],"I gas inerti (azoto, argon) diluiscono l'ossigeno abbassandone la concentrazione sotto il minimo necessario per la combustione (~14-15%).",{0:"Il raffreddamento è l'azione principale dell'acqua.",1:"L'inibizione chimica è tipica delle polveri e degli halon.",2:"Il raffreddamento dei gas inerti è trascurabile; la loro azione è il soffocamento."},"estinguenti"],

["Nello spegnimento di un incendio, l'anidride carbonica (CO2), agisce per:","Soffocamento",["Raffreddamento","Inibizione chimica","Raffreddamento e soffocamento"],"La CO2 è più pesante dell'aria e crea uno strato che priva il fuoco di ossigeno. L'effetto di raffreddamento è secondario.",{0:"Il raffreddamento della CO2 è secondario rispetto all'effetto soffocante.",1:"La CO2 non ha un'azione di inibizione chimica.",2:"L'azione principale è il soffocamento; il raffreddamento è marginale."},"estinguenti"],

["La scelta dell'agente estinguente:","Dipende dalle caratteristiche delle proprietà della sostanza estinguente, dalle dimensioni del fuoco prevedibile e dalla natura dei prodotti combustibili",["Dipende solo dalle caratteristiche delle proprietà della sostanza estinguente","È effettuata dal Datore di Lavoro, sulla base del suo giudizio esperto","Dipende solo dalla classe di incendio"],"La scelta ottimale richiede: proprietà dell'estinguente + dimensioni previste dell'incendio + natura dei combustibili.",{0:"Non basta considerare solo le proprietà dell'estinguente.",1:"La scelta è tecnica e basata su criteri oggettivi, non sul solo giudizio del DL.",2:"La classe è importante ma non è l'unico fattore."},"estinguenti"],

["L'impiego dell'acqua come agente estinguente è generalmente vietato in presenza di impianti elettrici sotto tensione:","Si",["No, mai","No, l'uso dell'acqua è vietato solo in presenza di sostanze reagenti con essa in modo violento","No, si può sempre usare acqua su impianti elettrici"],"L'acqua è conduttrice elettrica: il suo utilizzo su impianti sotto tensione può provocare folgorazione.",{0:"Il divieto è REALE e IMPORTANTE: l'acqua conduce elettricità.",1:"Il divieto riguarda ANCHE gli impianti elettrici, non solo le sostanze reattive.",2:"L'acqua su impianti elettrici sotto tensione è pericolosa."},"estinguenti"],

["L'impiego dell'acqua come agente estinguente è vietato in presenza di sostanze reagenti con essa in modo violento ed esplosivo o che possono dar luogo a prodotti tossici o corrosivi:","Si",["No, l'importante è provare a spegnere il principio di incendio","No, l'uso dell'acqua è vietato solo in presenza di impianti elettrici","No, si può sempre usare l'acqua sulle sostanze chimiche"],"Metalli alcalini (sodio, potassio), carburi reagiscono violentemente con l'acqua producendo idrogeno esplosivo o vapori tossici.",{0:"Usare acqua su sostanze reattive può AGGRAVARE l'incendio o causare esplosioni.",1:"Il divieto riguarda ENTRAMBE le situazioni: impianti elettrici E sostanze reattive.",2:"L'uso dell'acqua deve essere valutato in funzione della compatibilità chimica."},"estinguenti"],

["L'impiego dell'acqua come agente estinguente può essere sconsigliato in caso di ambienti con presenza di apparecchiature delicate e documenti a causa del danno che potrebbe derivarne per gli stessi:","Si",["No, l'importante è provare a spegnere sempre e comunque il principio di incendio","No, l'acqua non danneggia mai le apparecchiature","Solo se si tratta di apparecchiature sotto tensione"],"Nelle sale server, biblioteche, musei si preferiscono agenti gassosi o water mist per minimizzare i danni.",{0:"La scelta dell'agente estinguente deve considerare sia l'efficacia sia i danni collaterali.",1:"L'acqua può causare gravi danni a circuiti elettronici, documenti e opere d'arte.",2:"Il danno da acqua su apparecchiature e documenti è un problema anche senza tensione."},"estinguenti"],

["Le polveri utilizzate come agenti estinguenti sono sempre idonee per qualunque classe di incendio (A, B, D)?","No, a seconda della tipologia assumono comportamenti notevolmente diversi, alcune sono adatte per fuochi di classe A e B altre sono idonee per i fuochi di classe D",["Si","No, le polveri sono efficaci solo per i fuochi di classe A","No, le polveri sono idonee solo per incendi di classe B e C"],"Esistono polveri specifiche: polvere ABC per classi A,B,C; polvere D speciale per metalli. Non esiste una polvere universale.",{0:"Le polveri NON sono universali; ogni tipologia è progettata per classi specifiche.",1:"Le polveri ABC sono efficaci per A, B e C; non solo A.",2:"Le polveri sono efficaci per B e C ma esistono anche quelle per A e D."},"estinguenti"],

["Le schiume sono agenti estinguenti costituito da:","Una miscela di acqua, liquido schiumogeno e aria (o altro gas inerte)",["Solo acqua e aria compressa","Costituite da sostanze liquidi che quando vengono utilizzate si trasformano in gas inerti","Polveri chimiche diluite in acqua"],"Le schiume agiscono per soffocamento (coprono la superficie) e raffreddamento grazie alla componente acquosa.",{0:"Le schiume contengono anche un liquido schiumogeno essenziale per formare le bolle.",1:"Le schiume rimangono allo stato di schiuma, non diventano gas.",2:"Le schiume non contengono polveri; sono a base acquosa con schiumogeno."},"estinguenti"],

["Le schiume hanno le stesse limitazioni di impiego dell'acqua:","Si, essendo l'acqua un componente essenziale della schiuma estinguente",["No, essendo un aggregato di bolle di gas non ha limitazioni di impiego","No, le schiume non hanno limitazioni di impiego","Si, ma solo per le attività a basso rischio"],"Poiché le schiume contengono acqua, non vanno usate su impianti elettrici né su sostanze che reagiscono con l'acqua.",{0:"La componente acquosa le rende incompatibili con gli stessi materiali con cui è incompatibile l'acqua.",1:"Le schiume condividono le limitazioni dell'acqua per via della loro composizione.",2:"Le limitazioni non dipendono dal rischio dell'attività ma dalla compatibilità chimica."},"estinguenti"],

["Le schiume sono molto efficaci:","Su incendio che coinvolgono combustibili solidi e liquidi infiammabili",["Su incendi che coinvolgono sostanze gassose","Su incendi di classe D","Su incendi di classe C (gas)"],"Le schiume sono efficaci su classi A (solidi) e soprattutto B (liquidi), dove la coperta schiumosa impedisce la ri-evaporazione degli idrocarburi.",{0:"Le schiume non sono indicate per i gas infiammabili (classe C); non si può 'coprire' un gas.",1:"Le schiume non sono indicate per i metalli (classe D) che possono reagire con l'acqua.",2:"Per i gas la schiuma non è efficace."},"estinguenti"],

["Le sostanze estinguenti gassose sono ugualmente efficaci per tutte le classi di incendio:","No, generalmente molto efficaci su incendi di liquidi e gas infiammabili o, non essendo conduttrici, incendi che coinvolgono apparecchiature ed impianti elettrici sotto tensione",["Si","No, sono generalmente molto efficaci solo su incendi di materiali organici","No, i gas estinguenti sono efficaci solo su incendi di classe A"],"I gas estinguenti (CO2, azoto, FM-200) sono adatti per classi B, C e per impianti elettrici grazie alla non conduttività e all'assenza di residui.",{0:"I gas estinguenti non sono ugualmente efficaci su tutte le classi.",1:"I gas estinguenti non sono ottimali per i materiali organici solidi (classe A) dove l'acqua è più efficace.",2:"I gas estinguenti non sono ottimali per la classe A."},"estinguenti"],

["La CO2 è generalmente sconsigliata su apparecchiature sensibili alle brusche variazioni di temperatura:","Si",["No, la CO2 agisce solo per soffocamento non determinando problemi di raffreddamento","Si, ma solo su apparecchiature sotto tensione","No, la CO2 è sempre sicura per le apparecchiature"],"La CO2 produce un brusco raffreddamento (effetto Joule-Thomson) che può danneggiare componenti elettronici sensibili.",{0:"La CO2 raffredda significativamente per espansione; questo è il problema per le apparecchiature sensibili.",1:"Il problema dello shock termico riguarda qualsiasi apparecchiatura sensibile, non solo quelle sotto tensione.",2:"La CO2 può danneggiare apparecchiature elettroniche sensibili per lo shock termico."},"estinguenti"],

["Con il termine 'rischio di incendio' intendiamo:","La probabilità che l'evento incendio si verifichi (frequenza) e l'entità dei danni sulle persone e i beni presenti negli ambienti considerati conseguenti al verificarsi dell'evento (magnitudo)",["La proprietà o la qualità intrinseca di determinati materiali o attrezzature, oppure metodologie e pratiche del lavoro o di utilizzo di un ambiente, potenzialmente capaci di causare un incendio","Solo la probabilità che un incendio si verifichi","Solo l'entità dei danni in caso di incendio"],"Il rischio = probabilità × magnitudo. La prima risposta descrive il PERICOLO, non il rischio.",{0:"Quella è la definizione di PERICOLO DI INCENDIO, non di rischio.",1:"Il rischio comprende sia probabilità sia magnitudo.",2:"Il rischio comprende sia probabilità sia magnitudo."},"misure"],

["Le misure di prevenzione, propriamente dette, sono:","Tutte le misure finalizzate alla riduzione del rischio incendio mediante la riduzione della probabilità/frequenza di accadimento dell'evento (impianti a regola d'arte, …)",["Tutte le misure finalizzate alla riduzione del rischio incendio mediante la riduzione del danno conseguente all'evento","Tutte le misure finalizzate al mantenimento del livello di sicurezza raggiunto","Misure di protezione attiva come gli estintori"],"La prevenzione agisce PRIMA dell'incendio riducendo la probabilità che avvenga.",{0:"Le misure per ridurre il danno sono misure di PROTEZIONE.",1:"Il mantenimento del livello di sicurezza è la GSA.",2:"Gli estintori sono misure di protezione ATTIVA, non di prevenzione."},"misure"],

["Nei luoghi di lavoro, in conformità alle disposizioni dettate dal Dlgs 81/2008, è sempre obbligatorio per il Datore di Lavoro adottare idonee misure per prevenire gli incendi e tutelare l'incolumità delle persone:","Si, nei luoghi di lavoro è sempre obbligatorio adottare sempre misure per prevenire gli incendi",["No, si attuano solo se a seguito di specifica valutazione del rischio incendio il luogo di lavoro non risulta a rischio di incendio basso","No, solo per i luoghi di lavoro che sono contemporaneamente attività soggette ai controlli dei vigili del fuoco","No, l'obbligo dipende dal numero di lavoratori"],"Il D.Lgs. 81/2008 impone l'obbligo SEMPRE e per TUTTI i luoghi di lavoro.",{0:"L'obbligo è SEMPRE presente, indipendentemente dal livello di rischio valutato.",1:"L'obbligo si applica a tutti i luoghi di lavoro, non solo quelli soggetti ai VVF.",2:"L'obbligo non dipende dal numero di lavoratori."},"misure"],

["Le misure di protezione passiva sono:","Tutti quei dispositivi che, a seguito della rivelazione di un incendio, sono in grado di esplicare l'azione protettiva senza richiedere alcuna azione (impiantistica o umana)",["Tutti quei dispositivi che, a seguito della rivelazione di un incendio, per esplicare l'azione protettiva necessitano di un intervento o un'azione (impiantistica o umana)","Tutti quei dispositivi che consentono di ridurre la probabilità che si inneschi un incendio","Solo le strutture REI"],"La protezione passiva (compartimentazione, strutture REI, porte tagliafuoco, vie di esodo) agisce intrinsecamente senza attivazione.",{0:"Quelli che necessitano di intervento sono i dispositivi di PROTEZIONE ATTIVA.",1:"Ridurre la probabilità è la PREVENZIONE.",2:"La protezione passiva comprende molto più delle sole strutture REI."},"misure"],

["I sistemi di controllo dell'incendio (estintori, idranti, naspi, …) sono:","Misure di protezione attiva in quanto, per esplicare l'azione protettiva necessitano di un intervento o un'azione (impiantistica o umana)",["Misure di protezione passiva in quanto, per esplicare l'azione protettiva non necessitano di alcuna azione (impiantistica o umana)","Sono misure di prevenzione in quanto, la loro installazione consente di ridurre la frequenza di accadimento degli incendi","Misure di protezione passiva perché già installate"],"Estintori, idranti e naspi sono protezione ATTIVA perché richiedono l'intervento umano per funzionare.",{0:"Estintori e idranti richiedono intervento umano: sono protezione ATTIVA.",1:"Estintori e idranti non riducono la probabilità; intervengono dopo l'innesco.",2:"Essere già installati non li rende passivi; conta la necessità di attivazione."},"misure"],

["Le porte EI 'tagliafuoco' sono:","Misure di protezione passiva in quanto, per esplicare l'azione protettiva non necessitano di alcuna azione (impiantistica o umana)",["Misure di protezione attiva in quanto, per esplicare l'azione protettiva necessitano di un intervento o un'azione (impiantistica o umana)","Sono misure di prevenzione in quanto, la loro realizzazione consente di ridurre la frequenza di accadimento degli incendi","Misure di protezione attiva perché si aprono automaticamente"],"Le porte EI si trovano normalmente chiuse e bloccano il fuoco passivamente senza bisogno di attivazione.",{0:"Le porte EI normalmente chiuse agiscono passivamente.",1:"Le porte EI non riducono la probabilità di incendio; limitano la propagazione.",2:"La funzione di compartimentazione è sempre passiva."},"misure"],

["La Resistenza al fuoco rappresenta:","La capacità portante in caso di incendio, per una struttura, per una parte della struttura o per un elemento strutturale nonché la capacità di compartimentazione in caso di incendio per gli elementi di separazione strutturali (es. muri, solai, …) e non strutturali (es. porte, divisori, …)",["La capacità di compartimentazione in caso di incendio per gli elementi di separazione strutturali e non strutturali","La capacità di un materiale di non accendersi mai","La durata massima di un incendio in un compartimento"],"La resistenza al fuoco valuta R (portante), E (tenuta ai fumi) e I (isolamento termico) per un determinato intervallo di tempo.",{0:"La capacità di compartimentazione è solo la parte E e I; manca la capacità portante R.",1:"Un materiale può comunque prendere fuoco; la resistenza al fuoco riguarda la capacità strutturale.",2:"La resistenza al fuoco indica per quanto tempo un elemento mantiene le sue funzioni."},"misure"],

["Con il simbolo REI 60 si identifica un elemento costruttivo che:","Deve conservare, per 60 minuti, la capacità portante, la tenuta e l'isolamento termico",["Deve conservare, per 60 minuti, la capacità portante e la tenuta","Deve conservare, per 60 minuti, solo la capacità portante","Deve resistere al fuoco per almeno 60 anni"],"REI 60 garantisce TUTTE E TRE le prestazioni (R+E+I) per 60 minuti.",{0:"RE 60 indica portante+tenuta; REI 60 richiede anche l'isolamento termico (I).",1:"R 60 indica solo la capacità portante; REI 60 richiede anche tenuta e isolamento.",2:"Il numero indica MINUTI, non anni."},"misure"],

["Con il simbolo RE 60 si identifica un elemento costruttivo che:","Deve conservare, per 60 minuti, la capacità portante e la tenuta",["Deve conservare, per 60 minuti, la capacità portante, la tenuta e l'isolamento termico","Deve conservare, per 60 minuti, solo la capacità portante","Deve conservare, per 60 minuti, solo la tenuta"],"RE 60: garantisce R (portante) ed E (tenuta) per 60 minuti, ma NON l'isolamento termico (I).",{0:"REI 60 garantisce anche l'isolamento termico; RE 60 no.",1:"R 60 indica solo la capacità portante; RE 60 aggiunge anche la tenuta.",2:"RE 60 garantisce sia R sia E; non solo E."},"misure"],

["Con il simbolo R 60 si identifica un elemento costruttivo che:","Deve conservare, per 60 minuti, la capacità portante",["Deve conservare, per 60 minuti, la capacità portante, la tenuta e l'isolamento termico","Deve conservare, per 60 minuti, la capacità portante e la tenuta","È resistente al fuoco per sempre"],"R 60: solo capacità portante (R) per 60 minuti, senza requisiti di tenuta o isolamento.",{0:"REI 60 garantisce tutte e tre le prestazioni; R 60 solo la portante.",1:"RE 60 garantisce portante e tenuta; R 60 solo la portante.",2:"Il numero indica MINUTI di resistenza, non anni."},"misure"],

["La reazione al fuoco rappresenta:","Il comportamento di un materiale che, con la sua decomposizione, partecipa al fuoco al quale è stato sottoposto in specifiche condizioni",["La capacità portante in caso di incendio, per una struttura, per una parte della struttura o per un elemento strutturale","Grado di partecipazione di un materiale (o di un prodotto) al fuoco al quale è stato sottoposto","La velocità con cui si propaga un incendio"],"La reazione al fuoco misura quanto un materiale contribuisce all'incendio: accensione, propagazione fiamma, calore rilasciato.",{0:"Quella è la definizione della RESISTENZA AL FUOCO (REI).",1:"Quella è una definizione parziale della reazione al fuoco.",2:"La velocità di propagazione dipende da molti fattori; la reazione al fuoco è una caratteristica del singolo materiale."},"misure"],

["Con il termine 'rischio di incendio' intendiamo: Il campo di esplosività rappresenta:","L'intervallo nel quale la percentuale in volume di miscela aria-combustibile se innescata da origine ad una reazione di combustione",["L'intervallo nel quale la percentuale in volume di miscela aria-combustibile se innescata da origine solo ad una detonazione","L'intervallo nel quale la percentuale in volume di miscela aria-combustibile se innescata da origine ad una esplosione","La percentuale massima di combustibile tollerabile in un locale chiuso"],"Il campo di esplosività è l'intervallo di concentrazioni entro cui la miscela brucia se innescata (può manifestarsi come incendio o esplosione).",{0:"Non solo detonazione: comprende sia deflagrazioni sia detonazioni.",1:"Non solo esplosione: comprende tutte le combustioni rapide inclusi incendi.",2:"Non è una percentuale tollerabile ma l'intervallo in cui la miscela è reattiva."},"combustione"],

["La pulizia dei luoghi ed il mantenimento dell'ordine sono:","Misure preventive, in quanto concorrono alla riduzione della probabilità di innesco di incendi e alla velocità di crescita dei focolari",["Misure protettive, in quanto concorrono alla riduzione dei possibili danni conseguenti l'incendio","Misure gestionali che non concorrono alla riduzione dei rischi di incendio","Misure non previste dalla normativa antincendio"],"Eliminare combustibili superflui e mantenere l'ordine riduce sia la probabilità di innesco sia il combustibile disponibile.",{0:"Queste sono misure PREVENTIVE: agiscono sulla probabilità, non sui danni.",1:"Pulizia e ordine incidono direttamente sul rischio incendio.",2:"La normativa le include esplicitamente tra le misure di prevenzione."},"misure"],

["Il controllo e la manutenzione regolare dei sistemi, dispositivi, attrezzature e degli impianti rilevanti ai fini della sicurezza antincendio (es: impianti elettrici, adduzione gas, impianti termici, ecc) rientrano fra le azioni necessarie per prevenire l'insorgere di incendi:","Si",["No, sono misure gestionali che non incidono sulla probabilità di accadimento di un incendio","Il controllo e la manutenzione non rientrano fra le attività finalizzate alla sicurezza antincendio","Solo per gli impianti elettrici"],"La manutenzione regolare degli impianti riduce la probabilità di guasti che potrebbero causare incendi.",{0:"Il controllo e la manutenzione incidono direttamente sulla probabilità di accadimento.",1:"Sono tra le azioni fondamentali della prevenzione incendi.",2:"Il principio vale per tutti gli impianti rilevanti, non solo gli elettrici."},"misure"],

["La gestione dei lavori di manutenzione o di modifica dell'attività (cantieri) rientrano fra le azioni necessarie per prevenire l'insorgere di incendi:","Si",["No, sono misure gestionali che non incidono sulla probabilità di accadimento di un incendio","La pianificazione e gestione dei lavori non rientrano fra le attività finalizzate alla sicurezza antincendio","Solo per i cantieri esterni all'edificio"],"I lavori di manutenzione (saldatura, fiamme libere) sono tra le principali cause di incendio; la loro corretta gestione è fondamentale.",{0:"I cantieri sono tra le principali cause di incendio; la loro gestione incide direttamente sul rischio.",1:"La pianificazione dei lavori è una misura preventiva fondamentale.",2:"Il principio vale per tutti i cantieri, interni ed esterni."},"misure"],

["In attività lavorative, la formazione ed informazione del personale ai rischi specifici dell'attività è una misura di prevenzione incendi:","Si",["No, è una misura di protezione incendi","Non è una misura che contribuisce alla mitigazione del rischio incendio","È obbligatoria solo per gli addetti antincendio"],"La formazione riduce comportamenti errati che potrebbero causare incendi, agendo sulla probabilità di accadimento.",{0:"La formazione è una misura di PREVENZIONE; riduce la probabilità di comportamenti pericolosi.",1:"La formazione contribuisce direttamente alla riduzione del rischio.",2:"La formazione è obbligatoria per TUTTO il personale."},"misure"],

["L'adozione di istruzioni e segnaletiche contenenti i divieti e le precauzioni da osservare è una misura di prevenzione incendi:","Si",["No, è una misura di protezione incendi","Non è una misura che contribuisce alla mitigazione del rischio incendio","È una misura facoltativa"],"Le istruzioni e la segnaletica guidano i comportamenti sicuri riducendo la probabilità di innesco.",{0:"La segnaletica è una misura di PREVENZIONE: orienta i comportamenti.",1:"La segnaletica contribuisce alla mitigazione del rischio antincendio.",2:"La segnaletica di sicurezza è OBBLIGATORIA nei luoghi di lavoro."},"misure"],

["La progettazione e realizzazione a regola d'arte degli impianti tecnologici e di servizio (impianti elettrici, gas, riscaldamento, eccc) può essere considerata una misura di prevenzione degli incendi:","Si, perché la progettazione e realizzazione deve essere effettuata in modo da limitare la probabilità di costituire causa di incendio ed esplosione",["No, poiché la progettazione e realizzazione ha come obiettivo quello di limitare solo la propagazione di un incendio","La progettazione e realizzazione di impianti tecnologici e di servizio non influisce sul rischio incendio dell'attività lavorativa","È una misura di protezione, non di prevenzione"],"Impianti a regola d'arte riducono la probabilità di guasti elettrici, dispersioni di gas e altri scenari di innesco.",{0:"La progettazione a regola d'arte riduce la PROBABILITÀ di incendio, non solo la propagazione.",1:"La realizzazione degli impianti influisce direttamente sul rischio incendio.",2:"È una misura di PREVENZIONE perché riduce la probabilità di accadimento."},"misure"],

["In un luogo di lavoro, per mantenere nel tempo il livello di sicurezza antincendio realizzato, è necessario organizzare un adeguato controllo degli ambienti (verificare che i percorsi di esodo siano sempre fruibili e liberi da ostacoli, verificare il funzionamento dei dispositivi di apertura delle porte, ecc):","Si, la verifica delle condizioni di esercizio stabilite nella progettazione della sicurezza è fondamentale ai fini della mitigazione del rischio incendio",["No, il controllo degli ambienti di lavoro non influisce sulla sicurezza antincendio dell'attività","No, il datore di lavoro ha solo l'obbligo di fare manutenzione agli impianti e alle attrezzature antincendio","È sufficiente verificare annualmente"],"Il controllo periodico garantisce che le condizioni di sicurezza progettate siano mantenute nel tempo.",{0:"Il controllo degli ambienti è fondamentale per mantenere il livello di sicurezza.",1:"Il DL ha obblighi molto più ampi della sola manutenzione.",2:"Il controllo deve essere frequente e sistematico."},"misure"],

["La segnaletica di sicurezza contribuisce alla prevenzione e protezione dai rischi di incendio:","Si, l'adozione della segnaletica di sicurezza favorisce la corretta gestione dell'attività anche ai fini della sicurezza antincendio",["No, la segnaletica è facoltativa e non contribuisce a mitigare il rischio incendio","No, la segnaletica ha la finalità di prevenire solo i rischi per la salute delle persone","La segnaletica contribuisce solo all'esodo, non alla prevenzione"],"La segnaletica orienta i comportamenti (divieti, avvertimenti, prescrizioni) riducendo la probabilità di innesco e guidando l'esodo.",{0:"La segnaletica di sicurezza è OBBLIGATORIA e contribuisce attivamente.",1:"Contribuisce a prevenire tutti i rischi, inclusi quelli di incendio.",2:"Ha funzioni sia preventive sia di protezione."},"segnaletica"],

["Con riferimento al Dlgs 81/2008, con segnale di divieto intendiamo:","Un segnale che vieta un comportamento che potrebbe far correre o causare un pericolo",["Un segnale che avverte di un rischio o pericolo","Una segnaletica che prescrive un determinato comportamento","Un segnale che fornisce indicazioni relative alle uscite di sicurezza"],"I segnali di divieto (rotondi, fondo bianco, bordo e banda rossa) vietano comportamenti pericolosi.",{0:"Avvertire di un rischio è il segnale di AVVERTIMENTO (triangolare, giallo).",1:"Prescrivere un comportamento è il segnale di PRESCRIZIONE (rotondo, azzurro).",2:"Indicare le uscite è il segnale di SALVATAGGIO (quadrato, verde)."},"segnaletica"],

["Con riferimento al Dlgs 81/2008, con segnale di avvertimento intendiamo:","Un segnale che avverte di un rischio o pericolo",["Un segnale che vieta un comportamento che potrebbe far correre o causare un pericolo","Una segnaletica che prescrive un determinato comportamento","Un segnale che fornisce indicazioni relative alle uscite di sicurezza"],"I segnali di avvertimento (triangolari, fondo giallo, bordo nero) segnalano pericoli.",{0:"Vietare comportamenti è il segnale di DIVIETO (rotondo, rosso).",1:"Prescrivere comportamenti è il segnale di PRESCRIZIONE (rotondo, azzurro).",2:"Indicare le uscite è il segnale di SALVATAGGIO (quadrato, verde)."},"segnaletica"],

["Con riferimento al Dlgs 81/2008, con segnale di prescrizione intendiamo:","Una segnaletica che prescrive un determinato comportamento",["Un segnale che avverte di un rischio o pericolo","Un segnale che vieta un comportamento che potrebbe far correre o causare un pericolo","Un segnale che fornisce indicazioni relative alle uscite di sicurezza"],"I segnali di prescrizione (rotondi, fondo azzurro, pittogramma bianco) indicano comportamenti obbligatori.",{0:"Avvertire di un rischio è il segnale di AVVERTIMENTO (triangolare, giallo).",1:"Vietare comportamenti è il segnale di DIVIETO (rotondo, rosso).",2:"Indicare le uscite è il segnale di SALVATAGGIO (quadrato, verde)."},"segnaletica"],

["Con riferimento al Dlgs 81/2008, con segnale di salvataggio e soccorso intendiamo:","Un segnale che fornisce indicazioni relative alle uscite di sicurezza o ai mezzi di soccorso o di salvataggio",["Un segnale che avverte di un rischio o pericolo","Una segnaletica che prescrive un determinato comportamento","Un segnale che vieta un comportamento pericoloso"],"I segnali di salvataggio (quadrati/rettangolari, fondo verde, pittogramma bianco) indicano vie di esodo, uscite, punti di raccolta.",{0:"Avvertire di un rischio è il segnale di AVVERTIMENTO (triangolare, giallo).",1:"Prescrivere comportamenti è il segnale di PRESCRIZIONE (rotondo, azzurro).",2:"Vietare comportamenti è il segnale di DIVIETO (rotondo, rosso)."},"segnaletica"],

["Le forme e i colori utilizzati per i cartelli di sicurezza da impiegare nei luoghi di lavoro:","Sono puntualmente definiti nel DLgs 81/2008 in funzione del loro oggetto specifico e delle indicazioni fornite (cartelli di divieto, di avvertimento, di prescrizione, di salvataggio e per le attrezzature antincendio)",["Sono scelti dal Datore di Lavoro","Sono scelti dal professionista incaricato della valutazione del rischio","Sono liberi purché chiaramente visibili"],"Il D.Lgs. 81/2008 e le norme UNI EN ISO 7010 definiscono in modo preciso forme, colori e pittogrammi per ogni tipo di cartello.",{0:"I cartelli non sono a discrezione del DL; sono definiti normativamente.",1:"Il professionista applica la normativa; non può scegliere liberamente.",2:"Non è sufficiente che siano visibili; devono rispettare le specifiche normative."},"segnaletica"],

["I cartelli di sicurezza di forma 'rotonda', con pittogramma nero su fondo bianco e bordo e banda (verso il basso da sinistra a destra, inclinata di 45°) rossi sono:","Segnali di divieto",["Segnali di avvertimento","Segnali di prescrizione","Segnali per attrezzature antincendio"],"La forma rotonda con pittogramma nero su fondo bianco e banda rossa diagonale = segnale di DIVIETO.",{0:"I segnali di avvertimento sono TRIANGOLARI con fondo GIALLO.",1:"I segnali di prescrizione sono ROTONDI ma con fondo AZZURRO.",2:"I segnali per attrezzature antincendio sono QUADRATI con fondo ROSSO."},"segnaletica"],

["I cartelli di sicurezza di forma 'triangolare', con pittogramma nero su fondo giallo e bordo nero sono:","Segnali di avvertimento",["Segnali di divieto","Segnali di prescrizione","Segnali di salvataggio"],"Triangolo giallo con bordo nero = segnale universale di AVVERTIMENTO (pericolo generico, sostanze infiammabili, rischio elettrico).",{0:"I segnali di divieto sono ROTONDI con bordo e banda ROSSI.",1:"I segnali di prescrizione sono ROTONDI con fondo AZZURRO.",2:"I segnali di salvataggio sono QUADRATI con fondo VERDE."},"segnaletica"],

["I cartelli di sicurezza di forma 'rotonda', con pittogramma bianco su fondo azzurro sono:","Segnali di avvertimento",["Segnali di divieto","Segnali di prescrizione","Segnali di salvataggio"],"ATTENZIONE: nel file questa risposta risulta 'Segnali di avvertimento' nonostante la forma rotonda e fondo azzurro corrisponda ai segnali di prescrizione. Si riporta la risposta come da file originale.",{0:"I segnali di divieto sono rotondi con fondo bianco e bordo rosso.",1:"I segnali di prescrizione sono rotondi con fondo azzurro — ma nel file la risposta indicata è 'avvertimento'.",2:"I segnali di salvataggio sono quadrati con fondo verde."},"segnaletica"],

["I cartelli di sicurezza di forma 'quadrata o rettangolare', con pittogramma bianco su fondo verde sono:","Segnali di salvataggio",["Segnali per le attrezzature antincendio","Segnali di avvertimento","Segnali di prescrizione"],"Verde + quadrato/rettangolare = salvataggio: vie di esodo, uscite di emergenza, punti di raccolta.",{0:"Le attrezzature antincendio hanno fondo ROSSO.",1:"I segnali di avvertimento sono TRIANGOLARI con fondo GIALLO.",2:"I segnali di prescrizione sono ROTONDI con fondo AZZURRO."},"segnaletica"],

["I cartelli di sicurezza di forma 'quadrata o rettangolare', con pittogramma bianco su fondo rosso sono:","Segnali per le attrezzature antincendio",["Segnali di divieto","Segnali di salvataggio","Segnali di avvertimento"],"Rosso + quadrato/rettangolare + pittogramma bianco = attrezzature antincendio: estintori, idranti, naspi, pulsanti di allarme.",{0:"I segnali di divieto sono ROTONDI con banda rossa su fondo bianco.",1:"I segnali di salvataggio hanno fondo VERDE.",2:"I segnali di avvertimento sono TRIANGOLARI con fondo GIALLO."},"segnaletica"],

["Il datore di lavoro è responsabile dell'effettuazione di controlli e manutenzione sui presidi antincendio al fine di garantirne la costante efficienza e il regolare funzionamento:","Si, l'attività di controllo e manutenzione sui presidi antincendio è obbligatoria al fine di garantire la costante efficienza ed il regolare funzionamento",["No, la responsabilità è della ditta incaricata dell'effettuazione della manutenzione","No, è responsabilità dei lavoratori","Solo per i presidi installati dopo il 2021"],"Il D.Lgs. 81/2008 attribuisce al DL la responsabilità. Anche se affida la manutenzione a ditta esterna, la responsabilità rimane sua.",{0:"Anche se la manutenzione è svolta da ditta esterna, la RESPONSABILITÀ rimane al DL.",1:"I lavoratori possono svolgere la sorveglianza, ma la responsabilità è del DL.",2:"L'obbligo esiste indipendentemente dall'anno di installazione."},"gestione"],
