["La potenza termica è:","La quantità di calore per unità di tempo che una sorgente d'ignizione è in grado di trasferire",["La quantità di calore che una sorgente d'ignizione è in grado di assorbire","È la quantità di calore che un combustibile è in grado di trasferire","La quantità di calore prodotto durante la combustione"],"La potenza termica (kW) descrive la velocità con cui un incendio rilascia calore.",{0:"La potenza termica riguarda il TRASFERIMENTO di calore per unità di tempo, non l'assorbimento.",1:"Riguarda il TRASFERIMENTO di calore dalla sorgente, non del combustibile generico.",2:"La potenza termica è energia per unità di TEMPO; il calore totale prodotto è il carico di incendio."},"dpi"],

["Per conduzione termica si intende:","La trasmissione di calore che avviene in un mezzo solido, liquido o aeriforme dalle zone a temperatura maggiore verso quelle con temperatura minore, all'interno di un corpo solo o tra due corpi tra loro in contatto",["La trasmissione di calore all'interno di un fluido tramite il trasporto di materia","La trasmissione di calore che avviene nel vuoto","Il trasferimento di calore da un corpo più caldo a uno più freddo, anche nel vuoto"],"La conduzione avviene per contatto diretto tra molecole o corpi, senza spostamento di materia.",{0:"Il trasporto di calore tramite spostamento di materia è la CONVEZIONE.",1:"Il calore si trasmette nel vuoto per IRRAGGIAMENTO, non per conduzione.",2:"Il trasferimento nel vuoto è l'IRRAGGIAMENTO."},"dpi"],

["Nella convezione termica, la propagazione del calore, è associata al trasporto di materia?","Si",["No, solo nei gas","No","Solo nei liquidi"],"Nella convezione il calore si trasferisce grazie allo spostamento fisico del fluido (liquido o gas) che trasporta materia.",{0:"La convezione avviene sia nei gas sia nei liquidi.",1:"La convezione è SEMPRE associata al trasporto di materia.",2:"La convezione avviene sia nei liquidi sia nei gas."},"dpi"],

["L'irraggiamento o radiazione termica è:","La radiazione elettromagnetica emessa dalla superficie di un corpo che si trova ad una certa temperatura",["La capacità di un corpo di assorbire radiazioni elettromagnetiche","La trasmissione di calore all'interno di un fluido tramite il trasporto di materia","La trasmissione di calore per contatto diretto"],"L'irraggiamento è la trasmissione di calore tramite onde elettromagnetiche (infrarosse) senza necessità di mezzo materiale.",{0:"L'assorbimento è la proprietà opposta (ricevere energia); l'irraggiamento è l'EMISSIONE.",1:"Il trasporto tramite fluido è la CONVEZIONE.",2:"Il contatto diretto è la CONDUZIONE."},"dpi"],

["Tutti gli oggetti emettono radiazioni elettromagnetiche?","Si",["No","Dipende dalla temperatura","Solo i corpi incandescenti"],"Tutti i corpi a temperatura superiore allo zero assoluto emettono radiazioni elettromagnetiche (legge di Stefan-Boltzmann).",{0:"Tutti i corpi a T > 0 K emettono radiazioni; non esiste eccezione.",1:"Non dipende: TUTTI i corpi a temperatura > 0 K emettono.",2:"Anche i corpi a temperature ordinarie emettono (infrarosso); non solo quelli incandescenti."},"dpi"],

["Quante sono le zone che distinguono le aree a rischio esplosione (ATEX) per gas, vapori e nebbie?","3 (zona 0, zona 1, zona 2)",["2 (zona 1, zona 2)","2 (zona 10, zona 20)","4 (zona 0, zona 1, zona 2 e zona 3)"],"Per gas/vapori/nebbie: Zona 0 (presenza continua), Zona 1 (periodica), Zona 2 (accidentale).",{0:"Ci sono 3 zone; manca la zona 0 (la più pericolosa con presenza continua).",1:"Le zone 10, 11, 12 non esistono; le zone per le polveri sono 20, 21 e 22.",2:"Esistono solo 3 zone (0,1,2) per gas/vapori; la zona 3 non esiste."},"impianti"],

["Quante sono le zone che distinguono le aree a rischio esplosione (ATEX) per le polveri?","3 (zona 20, zona 21, zona 22)",["3 (zona 0, zona 1, zona 2)","2 (zona 10, zona 20)","2 (zona 0, zona 1)"],"Per le POLVERI: Zona 20 (presenza continua), Zona 21 (periodica), Zona 22 (accidentale).",{0:"Le zone 0,1,2 sono per GAS/VAPORI/NEBBIE; per le polveri sono 20,21,22.",1:"Le zone 10 non esistono per le polveri; le zone sono 20, 21 e 22.",2:"Ci sono 3 zone per le polveri (20,21,22), non solo 2."},"impianti"],

const TOPICS = [
  {id:'combustione', label:'Combustione & Fuoco', icon:'🔥'},
  {id:'classi', label:'Classi di Incendio', icon:'🏷️'},
  {id:'estinguenti', label:'Agenti Estinguenti', icon:'🧯'},
  {id:'misure', label:'Prevenzione & Protezione', icon:'🛡️'},
  {id:'esodo', label:'Sistema di Esodo', icon:'🚪'},
  {id:'segnaletica', label:'Segnaletica', icon:'⚠️'},
  {id:'gestione', label:'Gestione & Piano', icon:'📋'},
  {id:'impianti', label:'Impianti & Sistemi', icon:'⚙️'},
  {id:'dpi', label:'DPI & Varie', icon:'🥽'}
];

let quiz=[], idx=0, score={c:0,w:0}, lastMode='', answered=false;

function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function buildTopics(){
  const g=document.getElementById('topicsGrid');
  TOPICS.forEach(t=>{
    const count=Q.filter(q=>q[5]===t.id).length;
    const d=document.createElement('div');
    d.className='topic-btn';
    d.innerHTML=`<span class="t-icon">${t.icon}</span>${t.label}<span class="t-count">${count} domande</span>`;
    d.onclick=()=>startQuiz(t.id);
    g.appendChild(d);
  });
}

function startQuiz(mode){
  lastMode=mode;
  let pool;
  if(mode==='all') pool=[...Q];
  else if(mode==='random50') pool=shuffle([...Q]).slice(0,50);
  else pool=shuffle(Q.filter(q=>q[5]===mode));
  quiz=pool; idx=0; score={c:0,w:0};
  const t=TOPICS.find(t=>t.id===mode);
  let title=mode==='all'?'📚 Quiz Generale':mode==='random50'?'🎲 Simulazione Esame':(t?t.icon+' '+t.label:'Quiz');
  document.getElementById('quizTitle').textContent=title;
  document.getElementById('home').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('quiz').style.display='block';
  renderQ();
}

function renderQ(){
  if(idx>=quiz.length){showResults();return;}
  answered=false;
  const q=quiz[idx]; const tot=quiz.length;
  const pct=Math.round(idx/tot*100);
  document.getElementById('progTxt').textContent=`Domanda ${idx+1} di ${tot}`;
  document.getElementById('progPct').textContent=pct+'%';
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('sc').textContent=score.c;
  document.getElementById('sw').textContent=score.w;
  document.getElementById('sr').textContent=tot-idx;
  // q[0]=domanda, q[1]=corretta, q[2]=sbagliate[], q[3]=motivo_corretto, q[4]=motivi_sbagliati{}, q[5]=topic
  const opts=shuffle([{t:q[1],ok:true},{t:q[2][0],ok:false,i:0},{t:q[2][1],ok:false,i:1},{t:q[2][2],ok:false,i:2}]);
  document.getElementById('qContainer').innerHTML=`
    <div class="q-card animate-in">
      <div class="q-num">Domanda ${idx+1} / ${tot}</div>
      <div class="q-text">${q[0]}</div>
      <div class="options">${opts.map((o,n)=>`<button class="opt" onclick="pick(this,${o.ok},${o.ok?-1:o.i})">${o.t}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`;
}

function pick(btn,ok,wi){
  if(answered)return;
  answered=true;
  const q=quiz[idx];
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(ok){
    btn.classList.add('correct');
    score.c++;
    document.getElementById('fb').innerHTML=`
      <div class="feedback fb-ok">
        <span class="fb-title">✓ Risposta corretta!</span>
        ${q[3]}
      </div>
      <button class="next-btn" onclick="nextQ()">Prossima →</button>`;
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(b=>{if(b.textContent.trim()===q[1])b.classList.add('correct');});
    score.w++;
    const why=q[4][wi]||'';
    document.getElementById('fb').innerHTML=`
      <div class="feedback fb-err">
        <span class="fb-title">✗ Risposta errata</span>
        <strong>Perché è sbagliata la tua scelta:</strong> ${why}<br><br>
        <strong>✓ Risposta corretta:</strong><span class="correct-ans">${q[1]}</span>
        <strong>Perché è corretta:</strong> ${q[3]}
      </div>
      <button class="next-btn" onclick="nextQ()">Prossima →</button>`;
  }
  document.getElementById('sc').textContent=score.c;
  document.getElementById('sw').textContent=score.w;
}

function nextQ(){idx++;renderQ();}

function showResults(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('results').style.display='block';
  const tot=quiz.length;
  const pct=Math.round(score.c/tot*100);
  const c=document.getElementById('rCircle');
  let col,msg,sub;
  if(pct>=90){col='#38a169';msg='🏆 Eccellente!';sub='Ottima preparazione!';}
  else if(pct>=75){col='#3182ce';msg='👍 Buon risultato!';sub='Qualche lacuna da colmare.';}
  else if(pct>=60){col='#d69e2e';msg='📖 Sufficiente';sub='Ripassa le sezioni più deboli.';}
  else{col='#e53e3e';msg='📚 Da migliorare';sub='Rileggi il materiale e riprova.';}
  c.style.background=col;
  document.getElementById('rScore').textContent=pct+'%';
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('rSub').textContent=sub;
  document.getElementById('rC').textContent=score.c;
  document.getElementById('rW').textContent=score.w;
  document.getElementById('rT').textContent=tot;
}

function restartSame(){startQuiz(lastMode);}
function goHome(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('results').style.display='none';
  document.getElementById('home').style.display='block';
}

buildTopics();
</script>

</html>
