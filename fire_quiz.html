["La manutenzione sui presidi antincendio, al fine di garantirne la costante efficienza e il regolare funzionamento, deve essere effettuata da personale qualificato:","Si, il DM 1/09/2021 introduce la qualificazione dei manutentori dei presidi antincendio al fine di avere garanzie riguardo all'effettiva efficacia di manutenzione e controlli",["No, la manutenzione dei presidi antincendio può essere effettuata da qualunque operatore che si dichiara idoneo ed esperto","No, l'attività di manutenzione dei presidi antincendio non è necessaria per mantenere in efficienza i presidi","Solo per i sistemi sprinkler e gli IRAI"],"Il DM 1/09/2021 ha introdotto la figura del manutentore qualificato con requisiti tecnico-professionali specifici.",{0:"Il DM 01/09/2021 richiede requisiti formali certificati; non basta l'autodichiarazione.",1:"La manutenzione è fondamentale per la funzionalità dei presidi nel tempo.",2:"Il requisito di qualificazione vale per tutti i presidi, non solo per alcuni."},"gestione"],

["Con il termine 'manutenzione' dei presidi antincendio intendiamo:","Un'operazione o un intervento finalizzato a mantenere in efficienza ed in buono stato, impianti, attrezzature e altri sistemi di sicurezza antincendio",["Un'operazione o un intervento finalizzato a garantire la corretta progettazione e installazione dei presidi antincendio","Lo svolgimento dei controlli visivi dei presidi antincendio atti a verificare che gli impianti siano nelle normali condizioni operative","Solo la sostituzione dei componenti scaduti"],"La manutenzione comprende: ispezioni periodiche, prove funzionali, riparazioni, sostituzioni per mantenere operativo il presidio.",{0:"La progettazione e installazione sono fasi precedenti; la manutenzione avviene durante l'esercizio.",1:"I controlli visivi sono la SORVEGLIANZA, non la manutenzione.",2:"La manutenzione è più ampia della sola sostituzione."},"gestione"],

["Con 'sorveglianza' dei presidi antincendio intendiamo:","Lo svolgimento dei controlli visivi dei presidi antincendio atti a verificare, che gli impianti, le attrezzature e gli altri sistemi di sicurezza antincendio siano nelle normali condizioni operative, siano correttamente fruibili e non presentino danni materiali evidenti",["Un'operazione o un intervento finalizzato a mantenere in efficienza ed in buono stato, impianti, attrezzature e altri sistemi di sicurezza antincendio","Un'operazione o un intervento finalizzato a garantire la corretta progettazione e installazione dei presidi antincendio","Solo la verifica annuale degli estintori"],"La sorveglianza è un'attività frequente e semplice (controllo visivo) che i lavoratori formati possono svolgere.",{0:"Quella è la definizione della MANUTENZIONE.",1:"La progettazione e installazione sono fasi precedenti all'esercizio.",2:"La sorveglianza è più frequente dell'annuale e applicata a tutti i presidi."},"gestione"],

["Il tecnico manutentore qualificato è:","Una persona fisica in possesso dei requisiti tecnico professionali previsti dal D.M 1 settembre 2021 (conoscenza, competenza, abilità)",["Una qualunque persona che ha esperienza nel campo della manutenzione","È un tecnico abilitato (ingegnere, architetto, ecc)","Qualsiasi dipendente formato dal datore di lavoro"],"Il DM 01/09/2021 definisce requisiti specifici: percorso formativo riconosciuto, competenze verificate e aggiornamento periodico.",{0:"La sola esperienza non è sufficiente; il DM richiede requisiti formali certificati.",1:"Non è necessariamente ingegnere/architetto; sono richieste le qualifiche del DM.",2:"La formazione interna non è sufficiente; servono i requisiti del DM 01/09/2021."},"gestione"],

["Il controllo periodico è:","L'insieme di operazioni che devono essere effettuate con frequenza non superiore a quella indicata da disposizioni, norme, specifiche tecniche o manuali d'uso e manutenzione per verificare la completa e corretta funzionalità di impianti, attrezzature e altri sistemi di sicurezza antincendio",["L'insieme delle operazioni che devono essere effettuate quando si verifica un guasto ad un dispositivo di sicurezza antincendio","Lo svolgimento dei controlli visivi dei presidi antincendio","Solo la verifica annuale richiesta dalla normativa"],"Il controllo periodico si effettua a intervalli definiti e include prove funzionali più approfondite della sorveglianza.",{0:"Le operazioni in caso di guasto sono la MANUTENZIONE CORRETTIVA, non il controllo periodico.",1:"I controlli visivi sono la SORVEGLIANZA; il controllo periodico include prove funzionali.",2:"La frequenza è definita caso per caso; non è solo annuale."},"gestione"],

["Il controllo periodico dei presidi antincendio:","Può essere effettuato anche dai lavoratori normalmente presenti, dopo aver ricevuto adeguate istruzioni",["Può essere effettuato solo da un tecnico manutentore qualificato, in quanto presuppone un livello adeguato di competenze, conoscenze ed abilità","Non è obbligatorio se si effettua la sorveglianza","Deve essere effettuato solo dai VVF"],"Il controllo periodico può essere svolto da lavoratori adeguatamente formati.",{0:"Il tecnico qualificato è necessario per la MANUTENZIONE; il controllo periodico può essere svolto da personale formato.",1:"Sorveglianza e controllo periodico sono complementari, entrambi necessari.",2:"Il controllo periodico è una responsabilità interna, non dei VVF."},"gestione"],

["La sorveglianza dei presidi antincendio:","Può essere effettuato anche dai lavoratori normalmente presenti, dopo aver ricevuto adeguate istruzioni",["Può essere effettuato solo da un tecnico manutentore qualificato, in quanto presuppone un livello adeguato di competenze, conoscenze ed abilità","Non è necessaria se si effettua la manutenzione","Deve essere effettuata solo da personale VVF"],"La sorveglianza è semplice (controllo visivo) e può essere svolta da lavoratori presenti dopo formazione adeguata.",{0:"Il tecnico qualificato è per la MANUTENZIONE; la sorveglianza è più semplice.",1:"La sorveglianza è complementare e necessaria rispetto alla manutenzione.",2:"La sorveglianza è svolta internamente; i VVF non effettuano controlli ordinari."},"gestione"],

["Per 'aree a rischio specifico' si intende:","Ambito dell'attività caratterizzato da rischio di incendio sostanzialmente differente rispetto a quello tipico dell'attività",["I locali dove sono installati gli impianti tecnologici e di servizio","I luoghi dove possono formarsi atmosfere esplosive","Solo i depositi di materiali infiammabili"],"Le aree a rischio specifico sono zone con rischio significativamente maggiore (o minore) rispetto al resto dell'attività.",{0:"I locali con impianti tecnologici possono essere aree a rischio specifico, ma non tutti lo sono.",1:"Le atmosfere esplosive sono un caso particolare, non la definizione completa.",2:"Le aree a rischio specifico comprendono anche laboratori, archivi, cucine, ecc."},"gestione"],

["L'esplosione:","È il risultato di una rapida espansione di gas determinata da una reazione di combustione molto veloce",["Lacerazione improvvisa e fragorosa di un corpo solido e cavo per l'azione di un'eccessiva pressione dall'interno che ne vince la forza di coesione","Rumore secco e improvviso","Un fenomeno esclusivamente fisico senza reazione chimica"],"L'esplosione è una reazione di combustione con velocità di propagazione molto elevata, con repentino aumento di pressione e temperatura.",{0:"Quella è la definizione di SCOPPIO (rottura meccanica per pressione), non di esplosione chimica.",1:"Il rumore è un EFFETTO dell'esplosione, non la sua definizione.",2:"L'esplosione implica sempre una reazione chimica di combustione molto rapida."},"impianti"],

["Le atmosfere esplosive sono:","Miscele di sostanze infiammabili allo stato di gas, vapori, nebbie o di polveri con l'aria, a condizioni atmosferiche, in cui, dopo l'accensione, la combustione si propaga nell'insieme della miscela incombusta",["Miscele di sostanze infiammabili allo stato di gas con l'aria, a condizioni atmosferiche, in cui, dopo l'accensione, la combustione si propaga nell'insieme della miscela incombusta","Miscele di sostanze infiammabili allo stato di polveri con l'aria, a condizioni atmosferiche, in cui, dopo l'accensione, la combustione si propaga nell'insieme della miscela incombusta","Solo miscele di gas esplosivi con l'aria"],"Le atmosfere esplosive comprendono GAS, VAPORI, NEBBIE e POLVERI infiammabili in aria (classificazione ATEX).",{0:"La definizione corretta comprende anche vapori, nebbie e polveri, non solo gas.",1:"La definizione corretta comprende anche gas, vapori e nebbie, non solo polveri.",2:"Le atmosfere esplosive comprendono tutti i tipi di combustibili in fase dispersa."},"impianti"],

["Le sostanze in grado di produrre esplosioni sono:","Tutte quelle indicate negli altri punti",["Solo le miscele infiammabili di gas o vapori","Solo le polveri combustibili sospese in aria","Solo i gas compressi in bombole"],"Possono produrre esplosioni: gas, vapori, nebbie e polveri infiammabili, oltre a sostanze esplosive chimicamente instabili.",{0:"Anche le polveri combustibili sospese in aria possono dare luogo a esplosioni.",1:"Anche gas, vapori e nebbie possono produrre esplosioni.",2:"Le sostanze esplosive sono solo una parte; anche gas, vapori e polveri possono esplodere."},"impianti"],

["Un'esplosione è chiamata deflagrazione quando:","La reazione di combustione si propaga alla miscela infiammabile non ancora bruciata con una velocità minore di quella del suono",["L'esplosione è prodotta da sostanze esplosive","La reazione procede nella miscela non ancora bruciata con una velocità superiore a quella del suono (velocità di propagazione supersoniche dell'ordine del chilometro al secondo)","L'esplosione avviene in spazio aperto"],"Nella deflagrazione la fiamma si propaga in modo SUBSONICO; nella detonazione la velocità è supersonica.",{0:"La produzione da sostanze esplosive non definisce la deflagrazione; è la velocità subsonica.",1:"La velocità supersonica definisce la DETONAZIONE, non la deflagrazione.",2:"Deflagrazione e detonazione possono avvenire sia in spazio aperto sia chiuso."},"impianti"],

["Un'esplosione è chiamata detonazione quando:","La reazione procede nella miscela non ancora bruciata con una velocità superiore a quella del suono (velocità di propagazione supersoniche dell'ordine del chilometro al secondo)",["L'esplosione è prodotta da sostanze esplosive","La reazione di combustione si propaga alla miscela infiammabile non ancora bruciata con una velocità minore di quella del suono","L'esplosione avviene in un contenitore chiuso"],"Nella detonazione si forma un'onda di shock supersonica (velocità >1000 m/s); più distruttiva della deflagrazione.",{0:"La velocità supersonica è ciò che definisce la detonazione, non la produzione da sostanze esplosive.",1:"La velocità subsonica definisce la DEFLAGRAZIONE.",2:"La detonazione può avvenire sia in contenitore sia in spazio aperto."},"impianti"],

["La reazione al fuoco rappresenta il comportamento di un materiale che, con la sua decomposizione, partecipa al fuoco al quale è stato sottoposto in specifiche condizioni — La misura antincendio 'reazione al fuoco':","È una misura di protezione passiva che esplica i suoi principali effetti nella fase iniziale dell'incendio, con l'obiettivo di limitare l'innesco dei materiali e la propagazione dell'incendio",["È una misura di protezione passiva che esplica i suoi principali effetti nella fase generalizzata dell'incendio, con l'obiettivo di limitare la propagazione dell'incendio","È una misura di protezione attiva che esplica i suoi principali effetti nella fase iniziale dell'incendio","È una misura di prevenzione"],"Usare materiali con buona reazione al fuoco ritarda l'innesco e la propagazione nelle fasi INIZIALI.",{0:"La reazione al fuoco è più efficace nella fase INIZIALE, non in quella generalizzata.",1:"La reazione al fuoco è protezione PASSIVA (caratteristica intrinseca del materiale).",2:"È una misura di PROTEZIONE PASSIVA, non di prevenzione."},"misure"],

["Le classi di reazione al fuoco 0, 1, 2, 3, 4 e 5:","Esprimono le classi italiane di reazione al fuoco dei materiali",["Esprimono la classificazione alla reazione al fuoco dei mobili imbottiti","Esprimono le classi europee di reazione al fuoco dei materiali","Non esprimono una classificazione al fuoco per nessun materiale"],"Le classi 0-5 sono la classificazione ITALIANA di reazione al fuoco (DM 26/06/1984): 0=incombustibile, 5=altamente combustibile.",{0:"Le classi IM (1IM, 2IM, 3IM) sono per i MOBILI IMBOTTITI.",1:"Le classi EUROPEE sono A1,A2,B,C,D,E,F (EN 13501-1).",2:"Le classi 0-5 sono una classificazione reale e vigente in Italia."},"misure"],

["Le classi di reazione al fuoco A1, A2, B, C, D, E ed F:","Esprimono le classi europee di reazione al fuoco dei materiali",["Esprimono le classi italiane di reazione al fuoco dei materiali","Esprimono la classificazione alla reazione al fuoco dei mobili imbottiti","Non esprimono una classificazione al fuoco per nessun materiale"],"Le classi A1-F sono la classificazione EUROPEA di reazione al fuoco (EN 13501-1).",{0:"Le classi ITALIANE sono 0-5 (DM 26/06/1984).",1:"Le classi IM sono per i MOBILI IMBOTTITI.",2:"Le classi A1-F sono una classificazione europea ben definita."},"misure"],

["Le classi di reazione al fuoco:","Sono determinate sperimentalmente, con prove di laboratorio",["Sono determinate dal progettista antincendio","Sono stabilite dal produttore del materiale sulla base di norme di buona progettazione","Sono auto-dichiarate dal fabbricante"],"Le classi di reazione al fuoco si ottengono da prove standardizzate in laboratorio (ISO, EN) certificate.",{0:"Il progettista utilizza le classi; non le determina.",1:"Il produttore fornisce i dati delle prove; non le stabilisce soggettivamente.",2:"Le classi richiedono prove certificate da laboratori accreditati."},"misure"],

["Nell'evoluzione di un incendio si possono individuare le seguenti fasi caratteristiche:","Fase iniziale o di ignizione, fase di propagazione, incendio generalizzato (flash over) e estinzione e raffreddamento",["Fase iniziale o di ignizione, fase di propagazione e incendio generalizzato (flash over)","Fase iniziale o di ignizione, fase di propagazione e estinzione e raffreddamento","Solo fase di ignizione e fase di estinzione"],"Le quattro fasi: ignizione, propagazione, flash over, estinzione/raffreddamento.",{0:"Manca la fase di estinzione e raffreddamento.",1:"Manca la fase di incendio generalizzato (flash over).",2:"Mancano sia la fase di propagazione sia quella del flash over."},"combustione"],

["Nell'evoluzione di un incendio la fase iniziale o di ignizione di un incendio:","È caratterizzata da un focolaio d'incendio che interessa zone limitate dell'ambiente",["È caratterizzata dal coinvolgimento nella combustione di oggetti combustibili presenti nelle vicinanze della zona di innesco e con aumento rapido della temperatura e dell'energia di irraggiamento","È caratterizzata dalla transizione da uno stato di incendio localizzato alla propagazione delle fiamme a tutto il volume disponibile","È caratterizzata da temperature superiori a 500°C"],"Fase iniziale: incendio circoscritto al punto di innesco; temperature ancora basse; più facilmente controllabile.",{0:"Quella è la FASE DI PROPAGAZIONE.",1:"Quella è il FLASH OVER.",2:"Temperature >500°C caratterizzano il flash over, non la fase iniziale."},"combustione"],

["Nell'evoluzione di un incendio la fase propagazione:","È caratterizzata dal coinvolgimento nella combustione di oggetti combustibili presenti nelle vicinanze della zona di innesco e con aumento rapido della temperatura e dell'energia di irraggiamento",["È caratterizzata da un focolaio d'incendio che interessa zone limitate dell'ambiente","È caratterizzata dalla transizione da uno stato di incendio localizzato alla propagazione delle fiamme a tutto il volume disponibile con brusco incremento della temperatura","È caratterizzata dal decremento delle temperature"],"Durante la propagazione il fuoco si estende ai materiali adiacenti; temperatura e irraggiamento aumentano rapidamente.",{0:"Quella è la FASE INIZIALE.",1:"Quella è la descrizione del FLASH OVER.",2:"Il decremento delle temperature caratterizza la FASE DI RAFFREDDAMENTO."},"combustione"],

["Nell'evoluzione di un incendio la fase di incendio generalizzato (flash over):","È caratterizzata dalla transizione da uno stato di incendio localizzato alla propagazione delle fiamme a tutto il volume disponibile con brusco incremento della temperatura (oltre 500°) e crescita esponenziale della velocità di combustione",["È caratterizzata dal coinvolgimento nella combustione di oggetti combustibili presenti nelle vicinanze della zona di innesco e con aumento rapido della temperatura","È caratterizzata da un focolaio d'incendio che interessa zone limitate dell'ambiente","È caratterizzata dall'abbattimento delle temperature"],"Il flash over è il momento critico in cui tutto il materiale combustibile si incendia simultaneamente (T>500°C). Dopo il flash over la sopravvivenza è quasi impossibile.",{0:"Quella è la FASE DI PROPAGAZIONE.",1:"Quella è la FASE INIZIALE.",2:"L'abbattimento delle temperature caratterizza la FASE DI RAFFREDDAMENTO."},"combustione"],

["Nell'evoluzione di un incendio la fase di raffreddamento:","Ha inizio quando la maggior parte del materiale combustibile presente è bruciato, ed è caratterizzata dal decremento delle temperature all'interno del locale a causa del progressivo diminuire dell'apporto termico del materiale residuo",["È caratterizzata dal coinvolgimento nella combustione di oggetti combustibili presenti nelle vicinanze della zona di innesco e con aumento rapido della temperatura","È caratterizzata dalla transizione da uno stato di incendio localizzato alla propagazione delle fiamme a tutto il volume disponibile","È caratterizzata dall'abbattimento delle temperature a seguito dell'azione estinguente dell'acqua"],"Il raffreddamento avviene naturalmente quando il combustibile si esaurisce.",{0:"Quella è la FASE DI PROPAGAZIONE.",1:"Quella è il FLASH OVER.",2:"Il raffreddamento naturale avviene per esaurimento del combustibile, non solo per l'acqua."},"combustione"],

["I principali effetti sull'uomo sono determinati dai prodotti della combustione, ovvero:","Anossia (riduzione dell'ossigeno nell'aria), azione tossica dei gas, riduzione della visibilità per il fumo e azione termica del calore prodotto",["Anossia (riduzione dell'ossigeno nell'aria) e azione tossica dei gas","Riduzione della visibilità per il fumo e azione termica del calore prodotto","Solo le ustioni causate dalle fiamme"],"Le vittime di incendio muoiono più spesso per intossicazione e anossia che per ustioni dirette.",{0:"La riduzione della visibilità e il calore sono effetti ugualmente importanti.",1:"L'anossia e i gas tossici sono altrettanto pericolosi.",2:"La maggioranza delle vittime muore per inalazione di fumi e gas tossici, non per ustioni."},"combustione"],

["L'ossido di carbonio (CO), che generalmente si sviluppa durante gli incendi in ambienti chiusi a causa della carenza di ossigeno:","È una sostanza tossica che, combinandosi con l'emoglobina dei globuli rossi del sangue, impedisce all'ossigeno di raggiungere le cellule dell'organismo",["È un gas asfissiante","È un gas che non comporta rischi per le persone","È un gas dal colore caratteristico ed è facilmente individuabile dall'uomo"],"Il CO si lega all'emoglobina con affinità 200 volte superiore all'ossigeno, formando carbossiemoglobina.",{0:"Il CO non è un semplice asfissiante: è un tossico specifico del sangue.",1:"Il CO è estremamente pericoloso; causa intossicazione e morte anche a basse concentrazioni.",2:"Il CO è INCOLORE e INODORE: questa è la sua caratteristica più pericolosa."},"combustione"],

["L'ossido di carbonio (CO), gas tossico per il sangue, che generalmente si sviluppa durante gli incendi in ambienti chiusi a causa della carenza di ossigeno:","È un gas che non viene rilevato dall'uomo facilmente poiché è inodore, incolore e non irritante",["È un gas dall'odore caratteristico ed è facilmente percepibile dall'uomo","È un gas asfissiante che, pur non producendo effetti tossici sull'organismo, può essere pericolosa perché si sostituisce all'ossigeno nell'aria","È un gas che non comporta mai rischi per le persone"],"L'invisibilità del CO (inodore, incolore, non irritante) lo rende particolarmente pericoloso: le vittime perdono conoscenza senza accorgersene.",{0:"Il CO è INODORE: non ha odore caratteristico.",1:"Il CO produce effetti tossici specifici sul sangue (carbossiemoglobina).",2:"Il CO è estremamente pericoloso per la sua tossicità."},"combustione"],

["L'anidride carbonica, che si può sviluppare durante gli incendi in ambienti chiusi:","È un gas asfissiante che, pur non producendo effetti tossici sull'organismo, può essere pericolosa perché si sostituisce all'ossigeno nell'aria",["È una sostanza tossica per il sangue che impedisce all'ossigeno di raggiungere le cellule dell'organismo","È un gas che non comporta mai rischi per le persone","Ha un odore caratteristico ed è facilmente percepibile"],"La CO2 non è tossica come il CO ma ad alte concentrazioni diluisce l'ossigeno causando asfissia.",{0:"Quella è la descrizione del MONOSSIDO DI CARBONIO (CO), non della CO2.",1:"La CO2 è pericolosa ad alte concentrazioni per effetto asfissiante.",2:"La CO2 è inodore a basse concentrazioni."},"combustione"],

["La finalità della misura Esodo (S.4) è quella di:","Assicurare che gli occupanti dell'attività possano raggiungere un luogo sicuro o permanere al sicuro, autonomamente o con assistenza, prima che l'incendio determini condizioni incapacitanti negli ambiti dell'attività ove si trovano",["Assicurare che gli occupanti dell'attività possano raggiungere un luogo sicuro autonomamente prima che l'incendio determini condizioni incapacitanti","Assicurare che gli occupanti dell'attività possano permanere al sicuro prima che l'incendio determini condizioni incapacitanti","Permettere ai VVF di intervenire rapidamente"],"La misura Esodo deve garantire la salvaguardia di TUTTI gli occupanti, anche quelli non in grado di evacuare autonomamente.",{0:"L'esodo deve prevedere anche l'assistenza per chi non può evacuare autonomamente.",1:"L'obiettivo principale è raggiungere un luogo sicuro; la permanenza è un'opzione alternativa.",2:"L'esodo riguarda la salvaguardia degli occupanti, non l'accesso dei VVF."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, per 'Luogo sicuro' intendiamo:","Un luogo in cui è permanentemente trascurabile il rischio d'incendio per gli occupanti che vi stazionano o vi transitano durante l'esodo",["Un luogo in cui è temporaneamente trascurabile il rischio d'incendio per gli occupanti che vi stazionano o vi transitano durante l'esodo","Uno spazio a 'cielo libero' (cortile, ….)","Il piano terra dell'edificio"],"Il luogo sicuro offre protezione PERMANENTE; si distingue dal luogo sicuro temporaneo che offre protezione limitata nel tempo.",{0:"Il rischio deve essere PERMANENTEMENTE trascurabile; la temporaneità caratterizza il luogo sicuro TEMPORANEO.",1:"Uno spazio a cielo libero deve soddisfare specifiche condizioni per essere classificato luogo sicuro.",2:"Il piano terra può essere coinvolto nell'incendio."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, per 'Luogo sicuro temporaneo' intendiamo:","Un luogo in cui è temporaneamente trascurabile il rischio d'incendio per gli occupanti che vi stazionano o vi transitano durante l'esodo",["Un luogo in cui è permanentemente trascurabile il rischio d'incendio per gli occupanti che vi stazionano o vi transitano durante l'esodo","Uno spazio a 'cielo libero' (cortile, ….)","Un piano dell'edificio non raggiunto dall'incendio"],"Il luogo sicuro temporaneo (es. compartimento adiacente) offre protezione solo per un tempo limitato.",{0:"La protezione PERMANENTE caratterizza il LUOGO SICURO; quella temporanea il luogo sicuro TEMPORANEO.",1:"Uno spazio a cielo libero può essere luogo sicuro se soddisfa i requisiti.",2:"Un piano non raggiunto può essere temporaneamente sicuro ma deve soddisfare i requisiti."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, per 'spazio calmo' intendiamo:","Luogo sicuro temporaneo ove gli occupanti possono attendere e ricevere assistenza per completare l'esodo verso luogo sicuro",["Uno spazio a 'cielo libero'","Un luogo in cui è permanentemente trascurabile il rischio d'incendio","Un'area di attesa all'esterno dell'edificio"],"Lo spazio calmo è un'area protetta INTERNA (es. sul pianerottolo di una scala protetta) dove le persone con difficoltà motorie attendono i soccorritori.",{0:"Lo spazio a cielo libero è un concetto geometrico; lo spazio calmo è una misura di sicurezza.",1:"Il luogo sicuro offre protezione permanente; lo spazio calmo è temporaneo.",2:"Lo spazio calmo è all'INTERNO dell'edificio, non all'esterno."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, per 'via di esodo' intendiamo:","Un percorso senza ostacoli al deflusso, appartenente al sistema d'esodo, che consente agli occupanti di raggiungere un luogo sicuro dal luogo in cui si trovano",["Un qualunque percorso, a prescindere dalla geometria, che adduce dall'interno dell'edificio all'esterno","Un percorso a prova di fumo rispetto al compartimento servito, che adduce dall'interno all'esterno","Solo le scale di emergenza"],"La via di esodo deve essere libera da ostacoli e far parte del sistema di esodo progettato.",{0:"Non è sufficiente essere un percorso verso l'esterno: deve essere senza ostacoli e parte del sistema.",1:"Una via di esodo a prova di fumo è un caso specifico; non tutte lo sono.",2:"Le vie di esodo comprendono corridoi, scale, uscite; non solo le scale di emergenza."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, per 'corridoio cieco' intendiamo:","Una porzione di via d'esodo da cui è possibile l'esodo in un'unica direzione",["Un corridoio senza illuminazione","Una porzione di via d'esodo nella quale non sono realizzate aperture di aerazione e illuminazione naturale","Una via di esodo a prova di fumo"],"Il corridoio cieco (dead end) è pericoloso: in caso di incendio dalla parte aperta gli occupanti sono intrappolati.",{0:"L'illuminazione non definisce il corridoio cieco; è la direzione unica di esodo.",1:"L'assenza di aperture naturali non definisce il corridoio cieco.",2:"Un corridoio a prova di fumo è una via protetta; il corridoio cieco descrive la geometria."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, le modalità di esodo da un'opera di costruzione possono essere diverse:","Si, esodo simultaneo, esodo per fasi, esodo orizzontale progressivo ovvero protezione sul posto",["No, in caso di incendio gli occupanti devono spostarsi obbligatoriamente tutti verso un luogo sicuro","No, in caso di incendio gli occupanti devono spostarsi obbligatoriamente tutti dal compartimento di primo innesco in un compartimento adiacente","Esistono solo esodo simultaneo e protezione sul posto"],"Le quattro modalità consentono di adattare la strategia alle caratteristiche dell'edificio e degli occupanti.",{0:"Non esiste un'unica modalità obbligatoria.",1:"Lo spostamento nel compartimento adiacente è solo una delle modalità.",2:"Esistono quattro modalità, non solo due."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, l''esodo simultaneo' da un'opera di costruzione è:","Modalità di esodo che prevede lo spostamento contemporaneo degli occupanti fino a luogo sicuro",["Modalità di esodo di una struttura organizzata con più compartimenti, in cui l'evacuazione degli occupanti fino a luogo sicuro avviene in successione dopo l'evacuazione del compartimento di primo innesco","Modalità di esodo che prevede lo spostamento degli occupanti dal compartimento di primo innesco in un compartimento adiacente","Modalità di esodo che prevede la protezione degli occupanti nell'ambito in cui si trovano"],"L'esodo simultaneo è la modalità più comune: tutti evacuano contemporaneamente.",{0:"Quella è la definizione dell'ESODO PER FASI.",1:"Quello è l'ESODO ORIZZONTALE PROGRESSIVO.",2:"Quella è la PROTEZIONE SUL POSTO."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, l''esodo per fasi' da un'opera di costruzione è:","Modalità di esodo di una struttura organizzata con più compartimenti, in cui l'evacuazione degli occupanti fino a luogo sicuro avviene in successione dopo l'evacuazione del compartimento di primo innesco",["Modalità di esodo che prevede lo spostamento contemporaneo degli occupanti fino a luogo sicuro","Modalità di esodo che prevede lo spostamento degli occupanti dal compartimento di primo innesco in un compartimento adiacente","Modalità di esodo che prevede la protezione degli occupanti nell'ambito in cui si trovano"],"Usato in edifici alti o ospedali: si evacua prima il compartimento dell'incendio, poi quelli adiacenti.",{0:"Quello è l'ESODO SIMULTANEO.",1:"Quello è l'ESODO ORIZZONTALE PROGRESSIVO.",2:"Quella è la PROTEZIONE SUL POSTO."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, l''esodo orizzontale progressivo' da un'opera di costruzione è:","Modalità di esodo che prevede lo spostamento degli occupanti dal compartimento di primo innesco in un compartimento adiacente capace di contenerli e proteggerli fino a quando l'incendio non sia estinto o fino a che non si proceda ad una successiva evacuazione fino a luogo sicuro",["Modalità di esodo che prevede lo spostamento contemporaneo degli occupanti fino a luogo sicuro","Modalità di esodo di una struttura organizzata con più compartimenti, in cui l'evacuazione avviene in successione","Modalità di esodo che prevede la protezione degli occupanti nell'ambito in cui si trovano"],"Tipico degli ospedali: i pazienti vengono spostati nel compartimento adiacente senza doverli portare fuori dall'edificio.",{0:"Quello è l'ESODO SIMULTANEO.",1:"Quello è l'ESODO PER FASI.",2:"Quella è la PROTEZIONE SUL POSTO."},"esodo"],

["Nell'ambito dell'organizzazione del sistema di esodo, la 'protezione sul posto' è:","Modalità di esodo che prevede la protezione degli occupanti nell'ambito in cui si trovano",["Modalità di esodo che prevede lo spostamento contemporaneo degli occupanti fino a luogo sicuro","Modalità di esodo di una struttura organizzata con più compartimenti, in cui l'evacuazione avviene in successione","Modalità di esodo che prevede lo spostamento degli occupanti dal compartimento di primo innesco in un compartimento adiacente"],"La protezione sul posto si applica quando l'evacuazione è impossibile o più pericolosa della permanenza.",{0:"Quello è l'ESODO SIMULTANEO.",1:"Quello è l'ESODO PER FASI.",2:"Quello è l'ESODO ORIZZONTALE PROGRESSIVO."},"esodo"],

["Le vie di esodo devono avere un'altezza minima di 2 metri:","Si, ad eccezione di brevi tratti segnalati di vie di esodo utilizzabili esclusivamente da personale specificamente formato ovvero utilizzate occasionalmente da un numero limitato di occupanti",["No, l'altezza la stabilisce il progettista sulla base della valutazione del rischio","No, è sufficiente che i percorsi abbiano un'altezza minima di 1,80 m","Non ci sono requisiti di altezza"],"2 metri è il requisito normativo. Deroghe sono possibili solo per brevi tratti ad uso molto limitato.",{0:"2 metri è un requisito normativo; il progettista non può stabilire valori inferiori liberamente.",1:"1,80 m è inferiore al limite normativo di 2 m.",2:"Esiste un requisito di altezza minima di 2 m per le vie di esodo."},"esodo"],

["La misura antincendio 'Rilevazione ed allarme' ha come obiettivo:","La sorveglianza degli ambiti di un'attività, rilevare precocemente un incendio e diffondere l'allarme al fine di attivare le misure protettive (es. impianti automatici estinzione, ripristino della compartimentazione, evacuazione di fumi e calore, …)",["Attivare le misure gestionali (es. piano e procedure di emergenza e di esodo, …)","Attivare sia le misure protettive sia le misure gestionali","Solo segnalare l'allarme senza rilevare automaticamente"],"Un sistema IRAI interviene nelle primissime fasi dell'incendio attivando automaticamente le misure di protezione.",{0:"Le misure gestionali sono un obiettivo AGGIUNTIVO; la risposta corretta specifica primariamente le misure protettive tecniche.",1:"La risposta corretta specifica primariamente le misure protettive tecniche.",2:"Il sistema IRAI rileva automaticamente e segnala l'allarme."},"impianti"],

["Gli impianti di rivelazione incendio e segnalazione allarme incendio (IRAI) sono:","Impianti in grado di rivelare un incendio quanto prima possibile e di segnalare l'allarme al fine di attivare le misure antincendio tecniche (impianti automatici di controllo o estinzione dell'incendio, compartimentazione, evacuazione dei fumi e del calore, …) e procedurali (piano e procedure di emergenza e di esodo, …)",["Impianti in grado di rivelare un incendio quanto prima possibile e di segnalare l'allarme al fine di attivare le misure antincendio tecniche (impianti automatici di controllo o estinzione dell'incendio, compartimentazione, evacuazione dei fumi e del calore, …)","Impianti in grado di rivelare un incendio quanto prima possibile e di segnalare l'allarme al fine di attivare le misure procedurali (piano e procedure di emergenza e di esodo, …)","Solo impianti di segnalazione sonora"],"Gli IRAI attivano sia misure tecniche (sprinkler, serrande) sia misure procedurali (evacuazione, chiamata VVF).",{0:"Gli IRAI attivano anche le misure procedurali, non solo quelle tecniche.",1:"Gli IRAI attivano anche le misure tecniche, non solo quelle procedurali.",2:"Gli IRAI comprendono rivelatori, centrale, sirene, pulsanti; non sono solo segnalazione sonora."},"impianti"],

["La misura 'Controllo dell'incendio' ha come scopo:","L'individuazione dei presidi antincendio da installare nell'attività per fronteggiare gli eventuali incendi",["L'individuazione dei presidi antincendio da installare nell'attività per consentire il controllo, l'evacuazione o lo smaltimento dei prodotti della combustione in caso di incendio","Attivare le misure protettive e gestionali presenti presso l'attività lavorativa","Solo la rivelazione dell'incendio"],"La misura 'Controllo dell'incendio' comprende estintori, reti idranti, sprinkler e altri sistemi di inibizione/estinzione.",{0:"Lo smaltimento di fumo e calore è la misura 'Controllo Fumo e Calore'.",1:"L'attivazione è conseguenza del rilevamento; il controllo dell'incendio riguarda i presidi estinguenti.",2:"Il controllo va oltre la sola rivelazione."},"impianti"],

["I presidi antincendio installati nei luoghi di lavoro per il controllo dell'incendio sono:","Gli estintori d'incendio e gli impianti di protezione attiva contro l'incendio (es: rete idranti, impianti sprinkler …)",["Solo gli estintori","Solo gli impianti di protezione attiva contro l'incendio (es: rete idranti, impianti sprinkler …)","Solo i sistemi IRAI"],"I presidi per il controllo dell'incendio comprendono sia estintori sia impianti fissi.",{0:"I presidi comprendono anche gli impianti fissi, non solo gli estintori.",1:"I presidi comprendono anche gli estintori, non solo gli impianti fissi.",2:"I sistemi IRAI rilevano e segnalano; non combattono il fuoco."},"impianti"],

["Il presidio antincendio 'sprinkler' svolge prioritariamente un'azione di:","Controllo dell'incendio, cioè riesce a mantenere l'incendio stesso in uno stato di 'non sviluppo' o comunque di limitate dimensioni, tale da poter essere facilmente attaccato ed estinto dalle squadre di emergenza successivamente intervenute",["Serve ad estinguere definitivamente l'incendio, anche se si è diffuso all'intero locale servito","Riesce sempre a spegnere in maniera completa e definitiva l'incendio","Riesce ad abbattere la concentrazione dell'ossigeno a valori che non consentono lo sviluppo del fuoco"],"Lo sprinkler controlla l'incendio nelle fasi iniziali, guadagnando tempo per l'evacuazione e l'arrivo dei soccorsi.",{0:"Lo sprinkler non garantisce sempre l'estinzione completa; il suo obiettivo principale è il controllo.",1:"Lo sprinkler non estingue sempre completamente; è progettato per il controllo.",2:"Lo sprinkler eroga acqua, non riduce l'ossigeno."},"impianti"],

["Gli estintori:","Sono un presidio antincendio base e il loro impiego è riferibile solo ad un principio d'incendio",["Sono un presidio antincendio e il loro impiego è riferibile all'estinzione completa di incendi anche generalizzati","Sono un presidio antincendio e il loro impiego è riferibile all'inibizione di un incendio","Sono mezzi di protezione da utilizzate per l'estinzione completa di un incendio generalizzato"],"Gli estintori sono efficaci solo nelle PRIME FASI di un incendio (principio d'incendio). Per incendi sviluppati servono impianti fissi o VVF.",{0:"Gli estintori hanno capacità limitata; non per incendi generalizzati.",1:"Gli estintori non solo inibiscono; agiscono attivamente spegnendo il principio d'incendio.",2:"Gli estintori non sono progettati per estinguere incendi generalizzati."},"estinguenti"],

["Gli estintori devono essere sempre presenti nei luoghi di lavoro:","Si, sono un presidio di base complementare alle altre misure di protezione attiva e di sicurezza in caso d'incendio",["No, se nell'attività è presente la rete idranti non è necessario installare anche gli estintori","No, se nell'attività è presente un sistema sprinkler non è necessario installare anche gli estintori","Gli estintori sono obbligatori solo nei luoghi di lavoro ad alto rischio"],"Gli estintori sono presidi di base obbligatori che completano le altre misure di protezione attiva.",{0:"La presenza della rete idranti non esonera dall'obbligo degli estintori.",1:"La presenza degli sprinkler non esonera dall'obbligo degli estintori.",2:"Gli estintori sono obbligatori in tutti i luoghi di lavoro, non solo quelli ad alto rischio."},"estinguenti"],

["La prestazione di un estintore, cioè la 'grandezza dell'incendio' che è in grado di estinguere:","È determinata sperimentalmente e in funzione della classe dell'incendio è indicata con un codice composto da lettere e numeri (es 13 A – 89 B)",["Dipende dall'abilità dell'utilizzatore","È stabilita dal datore di lavoro sulla base della propria esperienza","Dipende solo dal peso dell'estintore"],"La prestazione (es. 13A-89B) è determinata con prove standardizzate secondo norme EN.",{0:"La prestazione è una caratteristica tecnica certificata; non dipende dall'utilizzatore.",1:"La prestazione è stabilita da prove di laboratorio, non dal DL.",2:"Il peso influisce sulla capacità ma la prestazione è determinata sperimentalmente."},"estinguenti"],

["Gli estintori sono mezzi di estinzione da usare per pronto intervento sui principi d'incendio:","Si, e si distinguono in relazione al peso complessivo in 'estintori portatili' ed 'estintori carrellati'",["No, sono mezzi di protezione da utilizzate per l'estinzione completa di un incendio generalizzato","Si, solo quelli che hanno una massa minore o uguale a 20 kg, cosiddetti estintori portatili","Si, solo quelli che hanno una massa minore o uguale a 20 kg"],"Gli estintori si dividono in portatili (≤20 kg) e carrellati (>20 kg).",{0:"Gli estintori sono per principi d'incendio, non per incendi generalizzati.",1:"Esistono anche gli estintori CARRELLATI (>20 kg); non solo i portatili.",2:"Esistono anche gli estintori CARRELLATI; la distinzione è tra portatili e carrellati."},"estinguenti"],

["Gli estintori portatili sono mezzi di estinzione da usare per pronto intervento sui principi d'incendio:","Si, sono quelli che hanno una massa fino a 20 kg",["No, sono mezzi di protezione da utilizzate per l'estinzione completa di un incendio generalizzato","Si, solo quelli che hanno una massa fino a 150 kg","Si, sono quelli che hanno una massa fino a 6 kg"],"Gli estintori portatili hanno massa ≤20 kg.",{0:"Gli estintori portatili sono per principi d'incendio, non per incendi generalizzati.",1:"150 kg è troppo: gli estintori portatili hanno massa ≤20 kg.",2:"6 kg è il limite per ambienti pubblici; i portatili in generale arrivano a 20 kg."},"estinguenti"],

["Gli estintori carrellati sono mezzi di estinzione da usare per pronto intervento sui principi d'incendio:","Si, sono quelli che hanno una massa superiore a 20 kg",["No, sono mezzi di protezione da utilizzate per l'estinzione completa di un incendio generalizzato","Si, sono quelli che hanno una massa fino a 150 kg","Si, sono quelli che hanno una massa fino a 20 kg"],"Gli estintori carrellati hanno massa >20 kg e sono montati su carrello per facilitarne lo spostamento.",{0:"Gli estintori carrellati sono per principi d'incendio (anche se più grandi dei portatili).",1:"Non esiste un limite di 150 kg specifico; i carrellati sono quelli con massa >20 kg.",2:"Quelli fino a 20 kg sono i PORTATILI."},"estinguenti"],

["La carica degli estintori portatili utilizzabili in ambienti accessibili al pubblico:","Non può essere superiore a 6 kg o 6 litri",["Non può essere superiore a 20 kg","Può essere di qualunque peso, anche superiore a 20 kg","Non può essere superiore a 12 kg"],"Il limite di 6 kg/6 litri garantisce che chiunque (anche non addestrato) possa maneggiare l'estintore in sicurezza.",{0:"20 kg è il limite generale per i portatili; per gli ambienti pubblici il limite è 6 kg/litri.",1:"Esiste un limite preciso di 6 kg/litri per gli ambienti pubblici.",2:"12 kg non è il limite normativo corretto per gli ambienti pubblici."},"estinguenti"],

["Un estintore è caratterizzato dall'agente estinguente che contiene:","Si, e si dividono in: a polvere, ad anidride carbonica, ad acqua e agenti estinguenti a base d'acqua (schiuma) ed a 'clean agent'",["No, gli estintori nei luoghi di lavoro possono essere solo a polvere","No, gli estintori nei luoghi di lavoro possono essere solo ad anidride carbonica","Gli estintori si dividono solo in portatili e carrellati"],"Gli estintori sono classificati per agente estinguente: polvere, CO2, acqua/schiuma, clean agent.",{0:"Gli estintori esistono con molti tipi di agente estinguente.",1:"Non solo CO2; esistono anche polvere, acqua/schiuma, clean agent.",2:"Portatile/carrellato è la classificazione per dimensioni; per agente estinguente esistono più tipologie."},"estinguenti"],

["Gli estintori portatili sono idonei all'utilizzo su impianti e apparecchiature elettriche:","Si, su impianti e apparecchiature sino a 1000 V ed alla distanza di 1 metro se l'agente estinguente è privo di conducibilità elettrica (es: polvere, anidride carbonica)",["Si, su impianti e apparecchiature sino a 1000 V ed alla distanza di 1 metro a prescindere dalla sostanza estinguente","No, mai","Solo gli estintori a CO2 sono idonei su impianti elettrici"],"CO2 e polvere (non conduttori) sono idonei su impianti fino a 1000 V mantenendo almeno 1 metro di distanza.",{0:"Non a prescindere dalla sostanza: deve essere non conduttrice.",1:"Gli estintori a CO2 e a polvere (non conduttori) sono idonei su impianti fino a 1000 V.",2:"Anche la polvere non conduttrice è idonea, non solo la CO2."},"estinguenti"],

["Gli estintori portatili a base d'acqua sono idonei all'utilizzo su impianti e apparecchiature elettriche:","Si, su impianti e apparecchiature sino a 1000 V ed alla distanza di 1 metro se superano la 'prova dielettrica' prevista dalla norma sugli estintori UNI 31-7",["Si, su impianti e apparecchiature sino a 1000 V ed alla distanza di 1 metro","No, mai","Solo se l'acqua è demineralizzata"],"Gli estintori idrici possono essere usati su impianti elettrici SOLO se superano la prova dielettrica specifica.",{0:"Non basta la distanza di 1 metro per gli estintori ad acqua: serve anche il superamento della prova dielettrica.",1:"Gli estintori ad acqua NORMALMENTE non sono idonei su impianti elettrici; eccezione solo con prova dielettrica.",2:"Non è sufficiente che l'acqua sia demineralizzata; serve la prova dielettrica certificata."},"estinguenti"],

["La tipologia degli estintori installati nei luoghi di lavoro deve essere selezionata:","Sulla base della valutazione del rischio e, in particolare in riferimento alle classi di fuoco (es. estintori per classe A, estintori polivalenti per classi AB, estintori per la classe F, …)",["Deve essere selezionata dai Vigili del Fuoco","È selezionata dal Datore di Lavoro sulla base della propria esperienza","Deve essere selezionata dal produttore degli estintori"],"La tipologia di estintore si sceglie in base alla classe d'incendio presente nell'attività.",{0:"La scelta è tecnica e responsabilità del DL assistito da professionisti; non è dei VVF.",1:"La scelta è basata su criteri tecnici oggettivi (classe d'incendio), non sulla sola esperienza.",2:"Il produttore certifica le prestazioni; la scelta è responsabilità del DL."},"estinguenti"],

["Nei luoghi chiusi, fatte salve incompatibilità, nei confronti di principi di incendio di classe A o classe B è opportuno l'utilizzo di:","Estintori a base d'acqua (estintori idrici)",["Estintori a polvere","Estintori ad anidride carbonica","Estintori a clean agent"],"Gli estintori idrici sono la scelta preferibile per classi A e B nei luoghi chiusi grazie all'efficacia del raffreddamento e all'assenza di residui nocivi.",{0:"La polvere è efficace ma lascia residui; per luoghi chiusi si preferisce l'acqua.",1:"La CO2 raffredda bruscamente; per classi A e B si preferisce l'acqua.",2:"I clean agent sono per ambienti con apparecchiature delicate; per A e B si preferisce l'acqua."},"estinguenti"],

["Gli estintori devono essere sempre disponibili per l'uso immediato:","Si, pertanto devono essere collocati in posizione facilmente visibile e raggiungibile, lungo i percorsi d'esodo in prossimità delle uscite dei locali, di piano o finali, ed in prossimità delle aree a rischio specifico",["No, poiché sono utilizzati dagli addetti antincendio devono essere posti in prossimità dei locali dove sono presenti gli addetti","No, è sufficiente che siano collocati in un qualunque locale del luogo di lavoro","Solo in prossimità delle uscite principali"],"La visibilità e l'accessibilità immediata sono fondamentali: in emergenza non c'è tempo per cercare un estintore.",{0:"Non solo vicino agli addetti: devono essere distribuiti lungo le vie di esodo e vicino alle aree a rischio.",1:"La collocazione deve essere specifica (vie di esodo, aree a rischio); non qualunque locale.",2:"Devono essere distribuiti lungo tutti i percorsi di esodo e aree a rischio, non solo alle uscite principali."},"estinguenti"],

["La rete idrica antincendi o rete idranti è un impianto di protezione attiva finalizzato al 'controllo dell'incendio':","Si, è un impianto fisso ad azionamento manuale",["Sì, è un impianto fisso ad azionamento automatico","No, è un impianto fisso finalizzato alla rilevazione dell'incendio","No, è un impianto mobile che viene attivato solo dai VVF"],"La rete idranti è un impianto FISSO che richiede azionamento MANUALE da parte degli addetti (al contrario degli sprinkler che sono automatici).",{0:"La rete idranti si aziona MANUALMENTE; gli sprinkler invece sono automatici.",1:"La rete idranti è per il controllo/estinzione; i sistemi IRAI sono per la rilevazione.",2:"La rete idranti è fissa e integrata nell'edificio; può essere usata anche dagli addetti, non solo dai VVF."},"estinguenti"],

["Le reti di idranti (RI) si distinguono in RI ordinarie e RI all'aperto:","Si, ordinarie, destinate alla protezione di attività ubicate all'interno di opere da costruzione, e all'aperto, destinate alla protezione di attività ubicate all'aperto",["No, esistono solo le RI ordinarie, destinate alla protezione di attività ubicate all'interno di opere da costruzione","No, esistono solo le RI all'aperto, destinate alla protezione di attività ubicate all'aperto","Le reti idranti sono tutte uguali"],"Le reti idranti si distinguono in RI ordinarie (per interni) e RI all'aperto (per attività all'aperto).",{0:"Esistono sia RI ordinarie sia RI all'aperto.",1:"Esistono sia RI ordinarie sia RI all'aperto.",2:"Le reti idranti si distinguono per tipologia e destinazione d'uso."},"estinguenti"],

["Le reti di idranti (RI) sono composte dai seguenti componenti principali:","Alimentazione idrica; rete di tubazioni fisse, preferibilmente chiuse ad anello, ad uso esclusivo; attacchi di mandata per autopompa; valvole; apparecchi erogatori",["Alimentazione idrica e rete di tubazioni fisse","Alimentazione idrica, attacchi di mandata per autopompa e valvole","Solo tubi e idranti"],"La rete idranti è un sistema complesso con alimentazione idrica, tubazioni, attacchi per autopompa, valvole e apparecchi erogatori.",{0:"Mancano attacchi per autopompa, valvole e apparecchi erogatori.",1:"Mancano la rete di tubazioni chiuse ad anello e gli apparecchi erogatori.",2:"La rete idranti è molto più complessa di soli tubi e idranti."},"estinguenti"],

["Gli apparecchi erogatori utilizzati nelle reti idranti ordinarie, destinate alla protezione di attività ubicate all'interno di opere da costruzione, si dividono in:","Idranti a muro di DN 45 (φ = 45 mm) o naspi di DN 25 (φ = 25 mm)",["Idranti a muro di DN 50 (φ = 50 mm) o naspi DN 30 (φ = 30 mm)","Nelle reti idranti ordinarie si utilizzano esclusivamente idranti a muro DN 45(φ = 45 mm)","Solo naspi DN 25 (φ = 25 mm)"],"Nelle reti idranti ordinarie per interni: idranti a muro da 45 mm o naspi da 25 mm.",{0:"I diametri corretti sono DN 45 per gli idranti a muro e DN 25 per i naspi.",1:"Sono presenti entrambe le tipologie: idranti a muro E naspi.",2:"Sono presenti entrambe le tipologie: idranti a muro E naspi."},"estinguenti"],

["La tubazione flessibile degli 'idranti a muro DN 45 (φ = 45 mm)' è in genere lunga:","20 metri",["50 metri","10 metri","30 metri"],"La tubazione flessibile degli idranti a muro DN 45 è normalmente di 20 metri.",{0:"50 metri è la lunghezza massima per i naspi DN 25, non degli idranti a muro.",1:"10 metri è troppo corto.",2:"30 metri non è la lunghezza standard per gli idranti a muro DN 45."},"estinguenti"],

["La tubazione semirigida dei 'naspi DN 25 (φ = 25 mm)' ha una lunghezza massima di:","30 metri",["50 metri","10 metri","20 metri"],"I naspi DN 25 hanno tubazione semirigida con lunghezza massima di 30 metri.",{0:"50 metri è la lunghezza della tubazione dei naspi DN 25 mm più grandi; il valore standard è 30 m.",1:"10 metri è insufficiente per la copertura richiesta.",2:"20 metri è la lunghezza degli idranti a muro DN 45, non dei naspi."},"estinguenti"],

["I sistemi automatici di inibizione, controllo o estinzione dell'incendio adottati nella misura 'controllo dell'incendio' possono erogare diversa tipologia di agenti estinguenti (acqua, gas, polvere …):","Si, in relazione alla classe dell'incendio e al rischio di incendio presente nell'attività",["No, i sistemi utilizzati per il 'controllo dell'incendio' possono erogare solo acqua (impianti sprinkler o diluvio)","No, i sistemi utilizzati per il 'controllo dell'incendio' possono erogare solo agenti estinguenti di tipo gassoso","No, i sistemi utilizzati per il 'controllo dell'incendio' possono erogare solo polvere chimica"],"I sistemi automatici possono usare acqua (sprinkler, diluvio), gas inerti (CO2, FM-200, Novec), polveri.",{0:"Esistono anche sistemi automatici a gas, a polvere e water mist.",1:"I sistemi gassosi sono solo una delle opzioni.",2:"I sistemi a polvere sono solo una delle opzioni."},"impianti"],

["Un impianto automatico a pioggia sprinkler:","Serve ad assicurare una pronta risposta all'incendio rivelandone la presenza e controllandolo in modo che l'estinzione possa essere completata con altri mezzi, oppure estinguendolo nello stadio iniziale",["Serve ad estinguere definitivamente l'incendio, anche se si è diffuso all'intero locale servito","Sono tutti aperti, all'attivazione dell'allarme viene erogata acqua contemporaneamente in tutto il locale protetto","È un impianto fisso ad azionamento manuale"],"Lo sprinkler è progettato per controllare l'incendio nelle fasi iniziali guadagnando tempo per l'evacuazione.",{0:"Lo sprinkler non garantisce sempre l'estinzione completa di un incendio generalizzato.",1:"Gli sprinkler sono chiusi con elementi termosensibili; si apre solo l'ugello nella zona del fuoco.",2:"Lo sprinkler è ad azionamento AUTOMATICO, non manuale."},"impianti"],

["Gli ugelli regolatori distribuiti sull'area protetta dagli impianti a pioggia sprinkler:","Sono chiusi con elementi che ad una data temperatura (termosensibili) si 'rompono' consentendo all'acqua di uscire",["Sono tutti aperti, all'attivazione dell'allarme viene erogata acqua contemporaneamente in tutto il locale protetto","Sono chiusi con elementi che si 'rompono' alla temperatura di progetto di 200°","Sono azionati manualmente dagli addetti antincendio"],"Gli sprinkler funzionano in modo SELETTIVO: solo l'ugello nella zona più calda si apre.",{0:"Quelli sono gli ugelli degli impianti a DILUVIO; gli sprinkler si aprono solo nella zona del fuoco.",1:"200°C non è la temperatura standard; varia in base al tipo di sprinkler (es. 68°C, 79°C, 93°C).",2:"Gli sprinkler sono automatici; non richiedono intervento umano."},"impianti"],

["Un impianto automatico a diluvio:","È un sistema fisso di protezione antincendio che inonda totalmente l'area con acqua sotto pressione, attraverso un sistema di tubazioni e di erogatori sprinkler privi del tappo e dell'elemento termosensibile",["Serve ad assicurare una pronta risposta all'incendio rivelandone la presenza e controllandolo in modo che l'estinzione possa essere completata con altri mezzi, oppure estinguendolo nello stadio iniziale","Serve ad assicurare una pronta risposta all'incendio rivelandone la presenza","Gli impianti a diluvio non esistono"],"L'impianto a diluvio ha tutti gli ugelli aperti e inonda l'intera area simultaneamente quando viene attivato.",{0:"Quella è la definizione dell'impianto SPRINKLER.",1:"Quella è una descrizione parziale; l'impianto a diluvio inonda tutta l'area contemporaneamente.",2:"Gli impianti a diluvio esistono e sono usati in aree ad alto rischio (hangar, depositi di liquidi)."},"impianti"],

["Negli impianti automatici a diluvio le tubazioni sono vuote e l'acqua è mantenuta a monte di un'apposita valvola a diluvio la cui apertura è comandata da un sistema di rivelazione incendi scaricando l'acqua contemporaneamente da tutti gli erogatori:","Si",["No, le tubazioni sono piene e l'acqua è scaricata solo nell'area in cui gli elementi termosensibili si aprono e consentono all'acqua di uscire","No, le tubazioni sono sempre piene","No, l'acqua è scaricata solo in alcune zone"],"Negli impianti a diluvio le tubazioni sono VUOTE a riposo; l'acqua entra TUTTA INSIEME quando la valvola a diluvio si apre.",{0:"Quella è la descrizione dell'impianto SPRINKLER (tubazioni piene, elementi termosensibili); nel diluvio le tubazioni sono vuote.",1:"Le tubazioni nei sistemi a diluvio sono VUOTE, non sempre piene.",2:"Nel diluvio l'acqua viene scaricata CONTEMPORANEAMENTE da TUTTI gli erogatori."},"impianti"],

["La Gestione della Sicurezza Antincendio è:","La misura di sicurezza antincendio finalizzata alla gestione di un'attività in condizioni di sicurezza, sia in fase di esercizio che in fase di emergenza, attraverso l'adozione di una organizzazione che prevede ruoli, compiti, responsabilità e procedure",["Finalizzata alla gestione di un'attività in condizioni di sicurezza in fase di esercizio, attraverso l'adozione di una organizzazione che prevede ruoli, compiti, responsabilità e procedure","Non è una misura di sicurezza antincendio ma una strategia","Solo la redazione del Piano di Emergenza"],"La GSA è un sistema organizzativo globale che comprende formazione, sorveglianza, manutenzione, controllo, procedure e gestione delle emergenze.",{0:"La GSA include sia la fase di ESERCIZIO sia quella di EMERGENZA.",1:"La GSA è una misura di sicurezza antincendio fondamentale del Codice.",2:"Il Piano di Emergenza è uno degli strumenti della GSA, non l'intera GSA."},"gestione"],

["La gestione della sicurezza antincendio (GSA) si divide nei due aspetti: gestione della sicurezza antincendio in esercizio e gestione della sicurezza antincendio in emergenza:","Si",["No, solo gestione della sicurezza antincendio in esercizio","No, solo gestione della sicurezza antincendio in emergenza","La GSA non si divide in aspetti distinti"],"La GSA comprende sia la gestione ordinaria (esercizio) sia quella straordinaria (emergenza).",{0:"La GSA include entrambi gli aspetti: esercizio ed emergenza.",1:"La GSA include entrambi gli aspetti: esercizio ed emergenza.",2:"Il Codice prevede esplicitamente i due aspetti della GSA."},"gestione"],

["Il Piano di Emergenza che il Datore di Lavoro redige ai sensi del Dlgs 81/2008 è:","L'organizzazione della risposta all'emergenza sviluppata e implementata sulla base della valutazione del rischio incendio nonché in risposta ad altri eventuali eventi emergenziali credibili (es terremoto, …)",["L'organizzazione della risposta all'emergenza sviluppata e implementata sulla base dell'esperienza del Datore di Lavoro","L'organizzazione della risposta all'emergenza mediante la redazione delle procedure per l'evacuazione del luogo di lavoro","Solo l'elenco degli addetti antincendio e dei loro compiti"],"Il Piano di Emergenza è basato sulla valutazione del rischio e coordina tutte le azioni da intraprendere in caso di incendio.",{0:"Il piano si basa sulla VALUTAZIONE DEL RISCHIO, non sulla sola esperienza del DL.",1:"Le procedure di evacuazione sono parte del piano; il piano è più completo.",2:"Il piano contiene molto più dell'elenco degli addetti."},"gestione"],

["Il Piano di Emergenza, redatto dal Datore di Lavoro per fronteggiare gli eventuali incendi che possono interessare il luogo di lavoro, deve contenere:","Le azioni che i lavoratori devono mettere in atto in caso di incendio; le procedure per l'evacuazione del luogo di lavoro che devono essere attuate dai lavoratori e dalle altre persone presenti; le disposizioni per chiedere l'intervento dei vigili del fuoco e per fornire le necessarie informazioni al loro arrivo; le specifiche misure per assistere le persone con esigenze speciali",["Le procedure per l'evacuazione del luogo di lavoro che devono essere attuate dai lavoratori e dalle altre persone presenti","Le disposizioni per chiedere l'intervento dei vigili del fuoco e per fornire le necessarie informazioni al loro arrivo","Solo le planimetrie dell'edificio"],"Il Piano di Emergenza è un documento completo che coordina tutte le azioni: azioni dei lavoratori, procedure di evacuazione, comunicazioni ai VVF, assistenza speciale.",{0:"Le procedure di evacuazione sono solo una parte; mancano le azioni dei lavoratori, le comunicazioni ai VVF e l'assistenza speciale.",1:"Le disposizioni per i VVF sono solo una parte.",2:"Le planimetrie sono parte del piano, ma non costituiscono il piano da sole."},"gestione"],

["Il Piano di Emergenza, redatto dal Datore di Lavoro per fronteggiare gli eventuali incendi che possono interessare il luogo di lavoro, deve essere portato a conoscenza di tutti i lavoratori, anche se non addetti antincendio:","Si, in particolare nel piano di emergenza devono essere indicati anche i provvedimenti necessari per assicurare che tutto il personale sia informato sulle procedure da attuare",["No, deve essere portato a conoscenza solo agli addetti antincendio che devono attuare gli incarichi e i compiti assegnati","No, deve essere portato a conoscenza dei VVF che devono intervenire in caso di incendio","Solo ai dirigenti dell'azienda"],"Ogni lavoratore deve sapere come comportarsi in caso di incendio.",{0:"TUTTI i lavoratori devono conoscere il piano.",1:"I VVF ricevono informazioni all'arrivo; il piano deve essere noto a tutti i lavoratori.",2:"L'informazione deve raggiungere tutti i livelli, non solo i dirigenti."},"gestione"],

["Il Piano di Emergenza, redatto dal Datore di Lavoro per fronteggiare gli eventuali incendi che possono interessare il luogo di lavoro, deve indicare le specifiche procedure per la chiamata dei vigili del fuoco:","Si, in modo da fornire correttamente informazioni utili per il soccorso: indirizzo del luogo di lavoro; tipologia emergenza e gravità; eventuale presenza di infortunati e di materiali e/o sostanze pericolosi presenti; informazioni su accesso e vie preferenziali per raggiungere il sito",["No, è sufficiente indicare il numero di soccorso da chiamare nelle planimetrie ubicate nel luogo di lavoro","No, gli addetti antincendio incaricati sono formati e addestrati e non necessitano di altre istruzioni","La procedura per i VVF non è necessaria nel Piano di Emergenza"],"Le procedure per i VVF devono essere dettagliate per garantire un intervento rapido ed efficace.",{0:"Non basta il numero; servono informazioni precise sull'emergenza, sui rischi e sui percorsi di accesso.",1:"Anche se formati, gli addetti devono seguire procedure definite per garantire coerenza.",2:"Le procedure per i VVF sono parte obbligatoria del Piano di Emergenza."},"gestione"],

["Per più luoghi di lavoro ubicati nello stesso edificio, ma facenti capo a titolari diversi, i piani di emergenza devono essere coordinati:","Si, in modo che i piani di emergenza delle singole attività siano coerenti fra loro",["No, è sufficiente che ogni datore di lavoro rediga il proprio piano di emergenza indipendente dagli altri piani","No, poiché nello stesso edificio non possono mai coesistere più luoghi di lavoro facenti capo a titolari diversi","La coordinazione è facoltativa"],"In un edificio con più inquilini, un'emergenza può coinvolgere tutte le attività; i piani devono essere coerenti.",{0:"Piani completamente indipendenti potrebbero creare conflitti durante un'emergenza reale.",1:"Nello stesso edificio possono coesistere più luoghi di lavoro con titolari diversi.",2:"La coordinazione è OBBLIGATORIA per garantire un'evacuazione ordinata."},"gestione"],

["La gestione dell'emergenza deve essere oggetto di preparazione e prove periodiche:","Si, la gestione dell'emergenza deve essere preparata durante l'esercizio ordinario dell'attività e oggetto di specifiche prove periodiche",["No, non è necessario fare le prove periodiche è sufficiente che la pianificazione della gestione delle emergenze sia portata a conoscenza dei lavoratori","No, in caso di emergenza gli addetti antincendio incaricati forniranno le istruzioni necessarie","Le prove periodiche sono obbligatorie solo per edifici ad alto rischio"],"Le esercitazioni periodiche sono obbligatorie per verificare che tutti sappiano come comportarsi e per identificare criticità del piano.",{0:"Conoscere il piano non è sufficiente: le prove pratiche sviluppano automatismi e identificano problemi.",1:"Le prove periodiche sono necessarie anche con addetti formati.",2:"L'obbligo non dipende dal livello di rischio dell'edificio."},"gestione"],

["Il Datore di Lavoro, nel predisporre il piano di emergenza, deve prevedere una adeguata assistenza alle persone con esigenze speciali:","Si, indicando misure di supporto alle persone con ridotte capacità sensoriali o motorie, tra le quali adeguate modalità di diffusione dell'allarme, attraverso dispositivi sensoriali (luci, scritte luminose, dispositivi a vibrazione) e messaggi da altoparlanti (ad esempio con sistema EVAC)",["No, non è necessario è sufficiente incaricare gli addetti antincendio che provvederanno in base alla loro formazione ed esperienza a gestire le persone con esigenze speciali","No, è sufficiente comunicare durante la chiamata di soccorso ai Vigili del Fuoco l'eventuale presenza di persone con esigenze speciali","L'assistenza speciale è facoltativa"],"Il piano deve prevedere misure specifiche per persone con disabilità: allarmi visivi, messaggi vocali (sistema EVAC), spazi calmi.",{0:"Le misure strutturali e impiantistiche sono necessarie; la sola disponibilità degli addetti non è sufficiente.",1:"L'assistenza deve essere pianificata PRIMA, non solo comunicata ai VVF all'arrivo.",2:"L'assistenza alle persone con esigenze speciali è OBBLIGATORIA."},"gestione"],

["La maschera a filtro si può usare in ambiente con presenza di ossigeno non inferiore al:","17%",["12%","6%","21%"],"Le maschere a filtro purificano l'aria ma non aggiungono ossigeno. Con meno del 17% di O2 non garantiscono protezione adeguata; servono autorespiratori.",{0:"Al 12% di ossigeno la maschera a filtro è pericolosamente insufficiente.",1:"Il 6% è una concentrazione di ossigeno letale in pochi secondi.",2:"Il 21% è la concentrazione normale in aria; il limite minimo per le maschere a filtro è il 17%."},"dpi"],

["Gli autorespiratori a ciclo aperto dispongono di bombole contenenti:","Aria compressa",["Ossigeno puro","Azoto puro","Una miscela di ossigeno ed elio"],"Gli autorespiratori SCBA usati dai VVF contengono aria compressa normale (non ossigeno puro).",{0:"L'ossigeno puro è usato in autorespiratori specifici per ambienti subacquei o medici.",1:"L'azoto puro è asfissiante; non è adatto per la respirazione.",2:"La miscela elio-ossigeno è usata in ambito subacqueo profondo."},"dpi"],

["Per diminuire il pericolo d'incendio in un locale adibito allo stoccaggio di liquidi infiammabili si può aumentare la temperatura del locale:","No, è necessario dotare il locale di aperture di ventilazione naturale",["Si","Solo se i liquidi sono in contenitori chiusi","Dipende dal tipo di liquido"],"Aumentare la temperatura aumenta la quantità di vapori infiammabili; bisogna invece ventilare il locale.",{0:"Aumentare la temperatura è PERICOLOSO: favorisce la vaporizzazione dei liquidi infiammabili.",1:"Non per contenitori chiusi; la ventilazione è sempre necessaria.",2:"Il principio vale per tutti i liquidi infiammabili."},"dpi"],

["Una bassa temperatura di infiammabilità indica che una sostanza:","È più facilmente infiammabile in presenza di innesco",["Emette fumi","Reagisce con altre sostanze","È più facilmente infiammabile in assenza di innesco"],"Un flash point basso significa che la sostanza forma vapori infiammabili già a basse temperature.",{0:"Emettere fumi non è la caratteristica specifica di un basso flash point.",1:"La reattività con altre sostanze è una caratteristica chimica diversa dall'infiammabilità.",2:"Un basso flash point indica facilità di accensione IN PRESENZA di innesco, non in assenza."},"dpi"],

["Immagazzinando combustibili che sviluppano vapori più pesanti dell'aria il pericolo è maggiore:","In locali sotterranei",["In locali al piano terra","In locali sopraelevati","Il livello del locale non influisce sul pericolo"],"I vapori pesanti (GPL, benzina) scendono e si accumulano nei locali sotterranei dove possono raggiungere concentrazioni esplosive.",{0:"Al piano terra i vapori pesanti tendono a scendere verso zone più basse.",1:"Nei locali sopraelevati i vapori pesanti tendono a scendere.",2:"Il livello del locale influisce significativamente."},"dpi"],

["In un ambiente con presenza di gas o vapori più pesanti dell'aria le aperture di ventilazione devono essere disposte:","A filo pavimento",["Sul tetto","A metà altezza delle pareti","In qualsiasi posizione"],"I gas pesanti si accumulano in basso: le aperture di ventilazione in basso favoriscono la dispersione.",{0:"Le aperture sul tetto sono indicate per gas LEGGERI (metano) che salgono.",1:"A metà altezza non è sufficiente per smaltire i gas pesanti che si raccolgono sul pavimento.",2:"La posizione delle aperture è fondamentale per l'efficacia."},"dpi"],

["Nel caso di un dardo di fuoco originato da una fuga di gas da una tubazione o da una flangia si procede:","Immediatamente all'intercettazione della fuga di gas",["Allo spegnimento con acqua","Allo spegnimento con schiuma","All'evacuazione senza intercettare la fuga"],"Un dardo di fuoco NON deve essere spento prima di intercettare la fuga: gas libero non acceso può formare miscela esplosiva.",{0:"Spegnere senza intercettare il gas è pericolosissimo: il gas continua a fuoriuscire e può formare una miscela esplosiva.",1:"La schiuma non è appropriata per fuoriuscite di gas.",2:"Evacuare è importante ma la fuga di gas non intercettata può causare un'esplosione."},"dpi"],

["La probabilità che possa verificarsi un incendio aumenta con la quantità di materiali combustibili:","Si",["No, la probabilità dipende solo dalla presenza di sorgenti di innesco","No, la quantità di materiali combustibili non influisce sulla probabilità di incendio","Solo se i materiali sono allo stato liquido"],"Maggiori sono i materiali combustibili (carico di incendio), maggiore è la probabilità di incendio.",{0:"Sia i combustibili sia le sorgenti di innesco aumentano la probabilità.",1:"La quantità di combustibili influisce direttamente sulla probabilità.",2:"Il principio vale per tutti gli stati fisici dei combustibili."},"dpi"],

["Il flash over è:","L'istante di propagazione generalizzata dell'incendio (transizione da fuoco localizzato a coinvolgimento di tutto l'ambiente)",["L'istante di innesco dell'incendio","L'istante di estinzione dell'incendio","Una fase di rallentamento dell'incendio"],"Il flash over avviene quando la temperatura supera i 500-600°C e tutti i materiali combustibili si incendiano simultaneamente.",{0:"L'innesco è la fase INIZIALE; il flash over avviene dopo una fase di crescita.",1:"L'estinzione è la fase FINALE; il flash over è il momento di massima espansione.",2:"Il flash over è un'ACCELERAZIONE drammatica, non un rallentamento."},"combustione"],

["Durante un incendio si possono avere difficoltà respiratorie a causa della:","Riduzione del tasso di ossigeno nell'aria",["Riduzione del tasso di azoto nell'aria","Aumento del tasso di ossigeno nell'aria","Presenza di vapore acqueo nell'aria"],"La combustione consuma ossigeno; la sua riduzione causa difficoltà respiratorie e anossia.",{0:"L'azoto non è consumato dalla combustione; la difficoltà respiratoria è dovuta alla riduzione di ossigeno.",1:"L'ossigeno diminuisce durante la combustione; non aumenta.",2:"Il vapore acqueo non causa di per sé difficoltà respiratorie."},"dpi"],

["In un compartimento di classe 120 di resistenza a fuoco una porta deve avere resistenza a fuoco pari a:","La metà di quella della struttura attraversata",["Uguale a quella della struttura attraversata","Il doppio di quella della struttura","Almeno EI 30, indipendentemente dalla struttura"],"Per le aperture nei compartimenti, la norma consente che le porte abbiano resistenza pari alla metà della struttura (EI 60 in un compartimento EI 120).",{0:"Non è necessario che la porta abbia la stessa resistenza della struttura; la norma consente la metà.",1:"EI 240 non è una classe standard.",2:"EI 30 può essere il minimo assoluto ma in un compartimento EI 120 la porta deve essere almeno EI 60."},"misure"],

["Le vie di esodo sono una misura di:","Protezione passiva",["Prevenzione","Protezione attiva","Gestione"],"Le vie di esodo (corridoi, scale, uscite) sono misure di protezione PASSIVA perché agiscono intrinsecamente senza attivazione.",{0:"Le vie di esodo non riducono la probabilità di incendio; sono protezione.",1:"Le vie di esodo non richiedono attivazione per funzionare: sono protezione PASSIVA.",2:"Le vie di esodo sono misure strutturali, non di gestione."},"esodo"],

["La lunghezza d'esodo deve essere valutata sulla base di:","La valutazione del rischio e del profilo di rischio vita",["Solo del numero di occupanti","Solo del tipo di attività","Non è necessario valutarla"],"La lunghezza massima delle vie di esodo dipende dal profilo di rischio vita (Rvita) che considera δocc e δα.",{0:"Il numero di occupanti è uno dei fattori; ma la valutazione richiede il profilo di rischio vita completo.",1:"Il tipo di attività influisce ma non è l'unico criterio.",2:"La lunghezza massima è definita normativamente in base al profilo di rischio."},"esodo"],

["Durante l'uso di un estintore è preferibile indirizzare l'agente estinguente:","Muovendo l'estintore a ventaglio",["Sempre nello stesso punto","Muovendo l'estintore dall'alto verso il basso","Solo alla base delle fiamme"],"La tecnica corretta è muovere l'estintore a ventaglio per coprire tutta la base dell'incendio.",{0:"Puntare sempre nello stesso punto non è efficace; il ventaglio copre una superficie maggiore.",1:"Non si muove dall'alto verso il basso; si usa il movimento a ventaglio alla base delle fiamme.",2:"La base delle fiamme è corretta, ma la tecnica specifica è il movimento a ventaglio."},"estinguenti"],

["Un impianto automatico di estinzione assolve alla funzione di:","Spegnimento dell'incendio",["Segnalazione acustica dell'incendio","Inertizzazione preventiva dell'ambiente","Solo rilevazione dell'incendio"],"Un impianto automatico di estinzione (sprinkler, gas, ecc.) è progettato per spegnere o controllare l'incendio.",{0:"La segnalazione acustica è funzione degli IRAI, non degli impianti di estinzione.",1:"L'inertizzazione preventiva è una tecnica preventiva diversa dall'estinzione.",2:"La rilevazione è funzione degli IRAI; l'impianto automatico di estinzione controlla/spegne l'incendio."},"impianti"],

["Per capacità termica di una sostanza si intende:","La quantità di calore che occorre fornire al materiale per aumentarne la sua temperatura di un grado centigrado",["La quantità di calore che una sorgente d'ignizione è in grado di trasferire","La capacità del materiale di resistere al calore","La quantità di calore necessaria per innalzare di 1°C, la temperatura dell'unità di massa (1kg)"],"La capacità termica di una sostanza è la quantità di calore necessaria per aumentarne la temperatura di 1°C.",{0:"Quella è la definizione di POTENZA TERMICA.",1:"Quella è la resistenza al calore, non la capacità termica.",2:"Quella è il CALORE SPECIFICO (per unità di massa), non la capacità termica totale."},"dpi"],

["Dire che una sostanza ha un'alta capacità termica significa che:","Riesce ad assorbire tanto calore innalzando di poco la propria temperatura",["Assorbe molta energia nei passaggi di stato","Assorbe poca energia nei passaggi di stato","Conduce bene il calore"],"Alta capacità termica = assorbe molto calore con piccolo aumento di temperatura (es. l'acqua).",{0:"L'energia nei passaggi di stato si chiama calore latente; diverso dalla capacità termica.",1:"Alta capacità termica significa assorbire MOLTO calore per un piccolo aumento di temperatura.",2:"La conduzione del calore è la conducibilità termica; diversa dalla capacità termica."},"dpi"],

["Il calore specifico è:","La quantità di calore necessaria per innalzare di 1°C, la temperatura dell'unità di massa (1kg)",["L'energia necessaria per permettere il passaggio di stato dell'acqua dallo stato liquido a vapore","La quantità di calore che occorre fornire al materiale per aumentarne la sua temperatura di un grado centigrado","La quantità di calore necessaria a portare la temperatura di un grammo d'acqua distillata da 14,5 °C a 15,5 °C, alla pressione atmosferica normale"],"Il calore specifico (J/kg·°C) è l'energia per alzare di 1°C la temperatura di 1 kg di sostanza.",{0:"L'energia per il passaggio di stato è il CALORE LATENTE.",1:"Quella è la CAPACITÀ TERMICA totale (non per unità di massa).",2:"Quella è la definizione della CALORIA (unità di misura del calore), non del calore specifico."},"dpi"],

["Quale tra le seguenti sostanze ha un valore di calore specifico (J/kgx°C) più elevato?","Acqua",["Alluminio","Benzina","Piombo"],"L'acqua ha il calore specifico più alto tra le sostanze comuni (~4186 J/kg·°C), ottima agente estinguente per raffreddamento.",{0:"L'alluminio ha calore specifico ~900 J/kg·°C, molto inferiore all'acqua.",1:"La benzina ha calore specifico ~2100 J/kg·°C, inferiore all'acqua.",2:"Il piombo ha calore specifico ~128 J/kg·°C, uno dei più bassi."},"dpi"],

["Quale tra le seguenti sostanze ha un valore di calore specifico (J/kgx°C) più basso?","Benzina",["Acqua","Alluminio","Piombo"],"ATTENZIONE: nel file la risposta indicata è 'Benzina'. Il piombo ha in realtà il calore specifico più basso tra le opzioni. Si riporta la risposta come da file originale.",{0:"L'acqua ha il calore specifico più ALTO (~4186 J/kg·°C).",1:"L'alluminio ha calore specifico ~900 J/kg·°C.",2:"Il piombo (~128 J/kg·°C) ha il calore specifico più basso, ma nel file la risposta indicata è 'Benzina'."},"dpi"],

["I metalli, in genere, hanno calori specifici piuttosto bassi. Questo significa che:","Con poca energia è possibile ottenere un considerevole aumento della temperatura",["Sono dei buoni isolanti termici","Sono buoni isolanti termici","Assorbe molta energia nei passaggi di stato"],"Basso calore specifico = con poca energia il metallo si scalda molto (es. ferro, alluminio si scaldano rapidamente).",{0:"I metalli con basso calore specifico sono in realtà BUONI CONDUTTORI termici, non isolanti.",1:"Basso calore specifico = si scaldano facilmente; non sono isolanti.",2:"Basso calore specifico riguarda il riscaldamento, non i passaggi di stato."},"dpi"],

["A quale metodo di conservazione dei gas ci si riferisce quando si parla di 'grado di riempimento'?","Gas liquefatti",["Gas compressi","Gas criogenici","Gas disciolti"],"Per i gas liquefatti (GPL, CO2, cloro) il 'grado di riempimento' indica quanto liquido c'è nella bombola rispetto alla capacità.",{0:"I gas compressi sono caratterizzati dalla pressione (bar); non si usa il 'grado di riempimento'.",1:"I gas criogenici sono caratterizzati dalla temperatura e dalla massa.",2:"I gas disciolti (acetilene) sono caratterizzati dalla pressione e dal solvente."},"dpi"],

["L'acetilene è un tipo di gas che, in genere, viene conservato:","Disciolto in un solvente",["Compresso","Liquefatto","Criogenico"],"L'acetilene è instabile ad alta pressione; viene conservato disciolto in acetone all'interno di bombole con materiale poroso.",{0:"L'acetilene NON si conserva compresso: è instabile e può decomporre esplosivamente ad alta pressione.",1:"L'acetilene non si liquefa facilmente alle condizioni normali.",2:"L'acetilene non è conservato allo stato criogenico."},"dpi"],

["Il GPL (miscela di gas principalmente butano e propano), in genere, viene conservato:","Liquefatto",["Compresso","Disciolto in un solvente","Criogenico"],"GPL = 'Gas di Petrolio Liquefatto': propano e butano si liquefano a pressioni moderate a temperatura ambiente.",{0:"Comprimere allo stato gassoso richiederebbe pressioni molto elevate; la liquefazione è più efficiente.",1:"La dissoluzione in solvente è il metodo per l'ACETILENE.",2:"La liquefazione criogenica è per gas con temperature critiche molto basse (azoto, ossigeno)."},"dpi"],

["La CO2 (anidride carbonica), in genere, viene conservata:","Compressa",["Liquefatta","Criogenica","Disciolta"],"ATTENZIONE: nel file la risposta indicata è 'compressa'. In realtà la CO2 può essere sia compressa sia liquefatta. Si riporta la risposta come da file originale.",{0:"La CO2 può essere anche liquefatta; nel file la risposta indicata è 'compressa'.",1:"La CO2 liquefatta criogenica esiste ma non è la conservazione tipica.",2:"La CO2 non si conserva disciolta in solventi."},"dpi"],

["Il Watt è:","L'unità di misura della potenza nel Sistema Internazionale. Per definizione 1 watt è il rapporto tra joule e secondo",["L'unità di misura della forza nel Sistema Internazionale","L'unità di misura dell'energia","L'unità di misura della potenza nel Sistema Internazionale. Per definizione 1 watt è il rapporto tra velocità e tempo"],"Il Watt misura la POTENZA (energia per unità di tempo): 1 W = 1 J/s.",{0:"La forza si misura in Newton (N).",1:"L'energia si misura in Joule (J); il Watt è J/s.",2:"Il Watt è J/s, non velocità/tempo."},"dpi"],
